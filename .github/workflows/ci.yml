name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: flybirds_ci
          POSTGRES_PASSWORD: flybirds_ci
          POSTGRES_DB: flybirds_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flybirds_ci -d flybirds_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # A disposable database for the PostgreSQL integration tests.
      AUTH_TEST_DATABASE_URL: postgres://flybirds_ci:flybirds_ci@localhost:5432/flybirds_ci?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Unit and PostgreSQL integration tests
        # -p 1: packages share the one test database.
        run: go test ./... -p 1 -count=1
      - name: Known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Translation keys
        run: npm run check:i18n
      - name: Unit tests
        run: npm run test:unit
      - name: Type check and build
        run: npm run build
      - name: Dependency audit
        run: npm audit --omit=dev

  release-stack:
    # Builds the production images and drives the real stack in a browser.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Development Compose file is valid
        run: docker compose config --quiet
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Provision a throwaway school
        working-directory: backend
        # The same tool operators use. The edge profile runs Caddy, as in
        # production; for localhost it issues a certificate from its own
        # local authority.
        run: |
          go run ./cmd/school-provision create --code ci-school --domain localhost --web-port 8081 --dry-run
          go run ./cmd/school-provision create --code ci-school --domain localhost --web-port 8081
          sed -i "s/^BACKUP_INTERVAL=.*/BACKUP_INTERVAL=0/" ../deploy/ci-school.env
      - name: Production Compose file is valid
        run: docker compose --env-file deploy/ci-school.env -f deploy/compose.prod.yaml config --quiet
      - name: Build and start the production stack
        run: docker compose --env-file deploy/ci-school.env -f deploy/compose.prod.yaml up -d --build --wait
      - name: Smoke checks
        run: |
          curl -fsS http://localhost:8081/ > /dev/null
          curl -fsS http://localhost:8081/api/readyz
          curl -fsS -D - -o /dev/null http://localhost:8081/ | grep -i "content-security-policy"
          curl -fsSk https://localhost/api/readyz
      - name: Seed the demo school
        env:
          DEMO_PASSWORD: CiDemoPassword!2026
        run: docker compose --env-file deploy/ci-school.env -f deploy/compose.prod.yaml exec -T -e DEMO_PASSWORD backend /app/seed-demo -confirm
      - name: Browser suite through the HTTPS edge
        env:
          E2E_BASE_URL: https://localhost
          E2E_INSECURE_TLS: '1'
          DEMO_PASSWORD: CiDemoPassword!2026
        run: node e2e/suite.mjs && node e2e/whitelabel.mjs
      - name: Online payment is off in a production school
        # The provisioned school leaves PAYMENT_SIMULATION_ALLOWED false.
        env:
          E2E_BASE_URL: http://localhost:8081
          DEMO_PASSWORD: CiDemoPassword!2026
          PAYMENT_MODE: 'off'
        run: node e2e/payment-safety.mjs
      # After the browser suite: these checks use up the login rate limit for
      # this runner's address for about a minute.
      - name: HTTPS edge, proxy trust and login rate limit
        run: bash deploy/test-edge.sh deploy/ci-school.env
      - name: Show service logs on failure
        if: failure()
        run: docker compose --env-file deploy/ci-school.env -f deploy/compose.prod.yaml logs --tail 200
