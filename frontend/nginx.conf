# Production web server for the built frontend. It serves the app and proxies
# /api/ to the backend container. TLS is terminated in front of this server
# (see deploy/Caddyfile), which also sets Strict-Transport-Security.

# Login attempts per client address. $remote_addr is never empty, so every
# request is counted; a connection that somehow lacks a usable client address
# shares one bucket rather than escaping the limit.
limit_req_zone $remote_addr zone=login:10m rate=30r/m;

# "Forgot password" per client address. A reset is rare, and the database
# limits how often one email address may be asked for; this limit stops one
# client walking a list of addresses. Asking for a link is the only request
# here that makes the server send an email, so it is the strictest.
limit_req_zone $remote_addr zone=reset:10m rate=6r/m;

server {
    # Direct access (the WEB_PORT on the host, or web:80 on the project
    # network): the connecting address is the client, and forwarding headers
    # are ignored.
    listen 80;
    # The TLS edge (deploy/Caddyfile) connects through this socket, on a
    # volume that only Caddy and this container mount. Only connections on
    # the socket may name the real client, in the X-Forwarded-For header that
    # Caddy sets itself (it discards any value the client sent).
    listen unix:/run/edge/web.sock;
    set_real_ip_from unix:;
    real_ip_header X-Forwarded-For;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Attachments are at most 10 MiB; photos and CSV imports are smaller.
    client_max_body_size 12m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/csv;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The camera is used only for QR attendance scanning.
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
    # School logos may be any HTTPS image; everything else is served from here.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location = /api/auth/login {
        limit_req zone=login burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8080/auth/login;
        # The API sets the same headers; keep one copy (the server-level ones).
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # "Forgot password". This is the only place the real client address is
    # known (the TLS edge sets it on the socket above), so the per-client
    # limit lives here; the backend counts per email address instead. The
    # address is passed on as a single value so the backend can record it.
    location = /api/auth/password/forgot {
        limit_req zone=reset burst=6 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8080/auth/password/forgot;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Setting the password with a link is limited too, so a stolen or guessed
    # link cannot be hammered. The link itself is 256 random bits.
    location = /api/auth/password/reset {
        limit_req zone=reset burst=12 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8080/auth/password/reset;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Demo quick login (off unless DEMO_QUICK_LOGIN=true): same limit as sign-in.
    location = /api/auth/demo-login {
        limit_req zone=login burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8080/auth/demo-login;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:8080/;
        # The API sets the same headers; keep one copy (the server-level ones).
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Backups and large exports can take longer than the 60 s default.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Hashed build assets never change; the app shell must always revalidate.
    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
