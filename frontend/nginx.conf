# Production web server for the built frontend. It serves the app and proxies
# /api/ to the backend container. TLS is terminated in front of this server
# (see deploy/Caddyfile), which also sets Strict-Transport-Security.

# Login attempts per client address. The API trusts no proxy headers, so the
# edge is the only layer that sees the real client.
limit_req_zone $binary_remote_addr zone=login:10m rate=30r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Attachments are at most 10 MiB; photos and CSV imports are smaller.
    client_max_body_size 12m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/csv;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The camera is used only for QR attendance scanning.
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
    # School logos may be any HTTPS image; everything else is served from here.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location = /api/auth/login {
        limit_req zone=login burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8080/auth/login;
        # The API sets the same headers; keep one copy (the server-level ones).
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:8080/;
        # The API sets the same headers; keep one copy (the server-level ones).
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Backups and large exports can take longer than the 60 s default.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Hashed build assets never change; the app shell must always revalidate.
    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
