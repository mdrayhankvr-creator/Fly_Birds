# Login attempts per client address. The API trusts no proxy headers, so the
# edge is the only layer that sees the real client.
limit_req_zone $binary_remote_addr zone=login:10m rate=30r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /api/auth/login {
        limit_req zone=login burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8080/auth/login;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
