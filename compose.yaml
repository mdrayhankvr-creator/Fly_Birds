services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flybirds}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flybirds_dev}
      POSTGRES_DB: ${POSTGRES_DB:-flybirds}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      PORT: "8080"
      GIN_MODE: release
      DATABASE_URL: postgres://${POSTGRES_USER:-flybirds}:${POSTGRES_PASSWORD:-flybirds_dev}@db:5432/${POSTGRES_DB:-flybirds}?sslmode=disable
      JWT_SIGNING_KEY_B64: ${JWT_SIGNING_KEY_B64:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      FILE_STORAGE_DIR: /app/uploads
      NOTIFY_INTERVAL: ${NOTIFY_INTERVAL:-1m}
      BACKUP_DIR: /app/backups
      BACKUP_RETENTION: ${BACKUP_RETENTION:-10}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-0}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - uploads_data:/app/uploads
      - backups_data:/app/backups
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_API_PROXY_TARGET: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
  backups_data:
