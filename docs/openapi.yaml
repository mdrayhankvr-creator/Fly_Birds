      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExamRoutineSlotInput' } } } }
      responses: { '200': { description: Slot updated and routine returned }, '409': { description: Schedule conflict }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
    delete:
