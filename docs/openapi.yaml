  /attendance/students/roster:
    get:
      operationId: getStudentAttendanceRoster
      tags: [attendance]
      summary: Read the daily roster for a section
      description: Requires attendance:students_read and enabled Attendance module; teachers are scoped to assigned classes.
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Paginated daily student roster; each marked row includes record_id and an opaque version }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
    put:
      operationId: saveStudentAttendanceRoster
      tags: [attendance]
      summary: Record and correct one section's attendance for one day in one transaction
      description: >-
        Requires attendance:students_manage, the Attendance module, and administrator role or a teacher assignment to the section's class.
        Every student must currently belong to the section and session; new marks need an active student; the date must be inside the session and not in the future.
        Only listed students change, so unmarked students are never recorded as absent. A correction must send the record_id and version from the roster;
        a mark equal to the stored one is unchanged, so repeated submissions are harmless. Any entry changed by someone else since loading rejects the whole save
        with 409 attendance_changed and the affected student_ids. Absent marks create pending absence events; other marks cancel them.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, section_id, attendance_date, entries]
              properties:
                session_id: { type: string, format: uuid }
                section_id: { type: string, format: uuid }
                attendance_date: { type: string, format: date }
                entries:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required: [student_id, status]
                    properties:
                      student_id: { type: string, format: uuid }
                      status: { type: string, enum: [present, absent, late] }
                      note: { type: string, maxLength: 500 }
                      record_id: { type: string, format: uuid, nullable: true }
                      version: { type: string, maxLength: 40 }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200': { description: 'Counts of created, updated and unchanged marks' }
        '400': { description: Invalid input, duplicate student, or future date }
        '403': { description: Not assigned to the class }
        '409': { description: 'attendance_changed (stale entries), attendance_conflict (membership, inactive student or section, date outside session) or duplicate_attendance' }
