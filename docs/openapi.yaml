      responses: { '201': { description: Slot created and routine returned }, '409': { description: Schedule conflict }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /routines/exams/{id}/slots/{slotId}:
    patch:
      operationId: updateExamRoutineSlot
