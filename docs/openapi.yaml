    delete:
      operationId: deleteExamRoutine
      summary: Delete an unpublished exam routine and its slots
      description: Requires routine:manage and administrator role.
      tags: [routine]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
