      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { type: object, properties: { category: { type: string }, in_app: { type: boolean }, sms: { type: boolean } } } } } } } } }
      responses: { '200': { description: Preferences }, '403': { description: Permission, role or module denied }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /notifications/dispatch:
    post:
      operationId: dispatchNotifications
      summary: "Run notification dispatch now"
      description: "Requires notifications:manage and administrator role. Idempotent: creates due notifications, withdraws corrected ones and hands queued SMS to the mock provider. The background worker runs the same step every NOTIFY_INTERVAL."
      tags: [notifications]
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Dispatch counts }, '403': { description: Permission, role or module denied }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /notifications/sms:
    get:
