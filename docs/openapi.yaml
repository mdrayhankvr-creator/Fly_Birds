  /routines/exams/{id}:
    get:
      operationId: getExamRoutine
      summary: Read an exam routine and ordered slots for oversight
      description: Requires routine:read and the routine module.
      tags: [routine]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Exam and ordered slots }, '404': { description: Routine missing }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
    patch:
      operationId: updateExamRoutine
      summary: Update an unpublished exam routine
      description: Requires routine:manage and administrator role. A routine with slots cannot move to another section or session.
      tags: [routine]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
