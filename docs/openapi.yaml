openapi: 3.0.3
info:
  title: Fly_Birds API
  version: 0.7.0
  description: M0/M1 APIs, M2 academic structure, and M4 staff management. Configuration requires PostgreSQL. Protected module routes check the active session, current role permission, and current database module state in that order.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Check API liveness
      description: Returns the API process status. It does not check database readiness.
      security: []
      responses:
        '200':
          description: API process is responding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /auth/login:
    post:
      operationId: login
      summary: Sign in with email and password
      description: Returns a 15-minute JWT access token. Sets a seven-day HttpOnly refresh cookie and a session-bound CSRF cookie. Invalid, unknown, locked, and disabled accounts receive the same credentials error.
      tags: [authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate refresh token and issue a new access token
      description: Requires flybirds_refresh and flybirds_csrf cookies. The X-CSRF-Token header must match the CSRF cookie and its server-side session hash. Refresh secrets are rotated and stored only as hashes.
      tags: [authentication]
      security: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Session refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401': { $ref: '#/components/responses/InvalidSession' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session
      description: Requires the refresh and CSRF cookies and X-CSRF-Token header. Revocation also invalidates access tokens tied to the session.
      tags: [authentication]
      security: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: Session revoked and cookies cleared }
        '401': { $ref: '#/components/responses/InvalidSession' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Get the authenticated user's own account
      description: Requires a valid access JWT, an active server-side session, the current auth:read_self role permission, and the core authentication module.
      tags: [authentication]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /auth/permissions:
    get:
      operationId: getMyPermissions
      summary: Get the current user's effective permissions
      description: Reads current role grants from PostgreSQL. Requires auth:read_self and the core permissions module.
      tags: [authentication]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/IDList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /roles:
    get:
      operationId: listRoles
      summary: List supported roles
      description: Requires roles:read. Results are ordered by ID.
      tags: [authorization]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Search' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses:
        '200': { description: Paginated roles, content: { application/json: { schema: { $ref: '#/components/schemas/RolePageResponse' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /permissions:
    get:
      operationId: listPermissions
      summary: List defined permission identifiers
      description: Requires permissions:read. Results are ordered by ID.
      tags: [authorization]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Search' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses:
        '200': { description: Paginated permissions, content: { application/json: { schema: { $ref: '#/components/schemas/PermissionPageResponse' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /roles/{id}/permissions:
    parameters: [{ $ref: '#/components/parameters/RoleId' }]
    get:
      operationId: getRolePermissions
      summary: Read a role's current grants
      description: Requires permissions:read.
      tags: [authorization]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/IDList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: replaceRolePermissions
      summary: Replace all grants for one role
      description: Requires permissions:manage and an administrator account. Valid IDs are unique. The admin role must retain auth:read_self and permissions:manage. Changes are atomic and effective for active sessions.
      tags: [authorization]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/IDListRequest' } } } }
      responses:
        '200': { $ref: '#/components/responses/IDList' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/LastAdmin' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
  /users/{id}/roles:
    parameters: [{ $ref: '#/components/parameters/UserId' }]
    get:
      operationId: getUserRoles
      summary: Read a user's assigned role
      description: Requires roles:read. The current user model supports one role per user, returned as a one-item array.
      tags: [authorization]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/IDList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: replaceUserRole
      summary: Replace a user's assigned role
      description: Requires permissions:manage and an administrator account. The ids array must contain exactly one supported role. The final active administrator cannot be demoted.
      tags: [authorization]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SingleRoleRequest' } } } }
      responses:
        '200': { $ref: '#/components/responses/IDList' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/LastAdmin' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
  /school/branding:
    get:
      operationId: getPublicSchoolBranding
      summary: Read public school name and theme
      description: Omits address, phone, email, and administrative settings. Uses neutral defaults until configured.
      tags: [school]
      security: []
      responses:
        '200': { description: Public branding, content: { application/json: { schema: { $ref: '#/components/schemas/BrandingResponse' } } } }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /school/settings:
    get:
      operationId: getSchoolSettings
      summary: Read school profile and theme
      description: Requires school_settings:read and the core school_settings module.
      tags: [school]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: School settings, content: { application/json: { schema: { $ref: '#/components/schemas/SchoolSettingsResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      operationId: updateSchoolSettings
      summary: Replace school profile and theme
      description: Requires an active administrator with school_settings:update. Logo is a validated public HTTPS image URL, not an upload. Colors must meet 4.5-to-1 contrast with white.
      tags: [school]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SchoolSettingsInput' } } } }
      responses:
        '200': { description: Updated settings, content: { application/json: { schema: { $ref: '#/components/schemas/SchoolSettingsResponse' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
  /school/grading:
    get:
      operationId: getSchoolGrading
      summary: Read active school grading bands
      description: Requires grading:read and the core school_settings module.
      tags: [school]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Active bands, content: { application/json: { schema: { $ref: '#/components/schemas/GradingResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      operationId: replaceSchoolGrading
      summary: Replace grading bands atomically
      description: Requires an active administrator with grading:update. Bands must cover every integer mark from 0 to 100 without gaps or overlaps. GPA is from 0 to 5 with at most two decimals.
      tags: [school]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GradingInput' } } } }
      responses:
        '200': { description: Updated bands, content: { application/json: { schema: { $ref: '#/components/schemas/GradingResponse' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /school/modules:
    get:
      operationId: listSchoolModules
      summary: List module definitions and current enablement
      description: Requires modules:read and the core school_settings module. Optional module definitions do not provide feature APIs yet.
      tags: [school]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Search' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses:
        '200': { description: Paginated modules, content: { application/json: { schema: { $ref: '#/components/schemas/ModulePageResponse' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /school/modules/{key}:
    parameters: [{ name: key, in: path, required: true, schema: { type: string }, description: Stable module key }]
    put:
      operationId: setSchoolModule
      summary: Enable or disable an optional module
      description: Requires an active administrator with modules:manage. Core modules cannot be disabled. Status is read from PostgreSQL on each module-protected request.
      tags: [school]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [enabled], additionalProperties: false, properties: { enabled: { type: boolean } } } } } }
      responses:
        '200': { description: Updated module, content: { application/json: { schema: { $ref: '#/components/schemas/ModuleResponse' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Core module cannot be disabled, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users with search, role, status and pagination
      description: Requires active admin, users:read, and the permissions module.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: role, in: query, schema: { type: string, enum: [admin, head_teacher, teacher, student, guardian, accountant] } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: Users, content: { application/json: { schema: { $ref: '#/components/schemas/UserPageResponse' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createUser
      tags: [users]
      summary: Create an account with a privately delivered initial password
      description: Requires active admin, users:create, permissions:manage, and the permissions module. The password is accepted only in the request body, immediately hashed, and never returned. Password delivery and later reset are outside this checkpoint.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateUserInput' } } }
      responses:
        '201': { description: Created user, content: { application/json: { schema: { $ref: '#/components/schemas/ManagedUserResponse' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Email already registered }
  /users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getUser
      tags: [users]
      summary: Read one user
      description: Requires active admin, users:read, and the permissions module.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: User, content: { application/json: { schema: { $ref: '#/components/schemas/ManagedUserResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: User not found }
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update email and display name
      description: Requires active admin, users:update, and the permissions module. Role and status have separate guarded operations.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateUserInput' } } }
      responses:
        '200': { description: Updated user, content: { application/json: { schema: { $ref: '#/components/schemas/ManagedUserResponse' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: User not found }
        '409': { description: Email already registered }
  /users/{id}/status:
    patch:
      operationId: setUserStatus
      tags: [users]
      summary: Activate or deactivate a user
      description: Requires active admin, users:update, and the permissions module. Deactivation revokes all sessions in the same transaction. The last active authorized administrator is protected.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StatusInput' } } }
      responses:
        '200': { description: Updated user, content: { application/json: { schema: { $ref: '#/components/schemas/ManagedUserResponse' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: User not found }
        '409': { description: Last authorized administrator cannot be deactivated }
  /audit/events:
    get:
      operationId: listAuditEvents
      tags: [audit]
      summary: Read audit events
      description: Requires active admin, audit:read, and the permissions module. Sort is newest or oldest by timestamp and event ID. There are no audit mutation endpoints.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: actor, in: query, schema: { type: string, format: uuid } }
        - { name: action, in: query, schema: { type: string } }
        - { name: target_type, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [newest, oldest], default: newest } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: Audit events, content: { application/json: { schema: { $ref: '#/components/schemas/AuditPageResponse' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /academic/sessions:
    get:
      operationId: listAcademicSessions
      tags: [academic-sessions]
      summary: List academic sessions
      description: Requires academic_sessions:read and the enabled academics module. Names are searched case-insensitively.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200': { description: Paginated sessions, content: { application/json: { schema: { $ref: '#/components/schemas/AcademicSessionPageResponse' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createAcademicSession
      tags: [academic-sessions]
      summary: Create an inactive academic session
      description: Requires an active administrator, academic_sessions:create, and the enabled academics module.
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AcademicSessionInput' } } } }
      responses:
        '201': { description: Created session, content: { application/json: { schema: { $ref: '#/components/schemas/AcademicSessionResponse' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Normalized name already exists, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /academic/sessions/current:
    get:
      operationId: getCurrentAcademicSession
      tags: [academic-sessions]
      summary: Get the active academic session
      description: Requires academic_sessions:read and the enabled academics module. Returns 404 if none is active.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Active session, content: { application/json: { schema: { $ref: '#/components/schemas/AcademicSessionResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /academic/sessions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getAcademicSession
      tags: [academic-sessions]
      summary: Get an academic session
      description: Requires academic_sessions:read and the enabled academics module.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Session, content: { application/json: { schema: { $ref: '#/components/schemas/AcademicSessionResponse' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateAcademicSession
      tags: [academic-sessions]
      summary: Edit an academic session name and dates
      description: Requires an active administrator, academic_sessions:update, and the enabled academics module. Activation is a separate operation.
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AcademicSessionInput' } } } }
      responses:
        '200': { description: Updated session, content: { application/json: { schema: { $ref: '#/components/schemas/AcademicSessionResponse' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Normalized name already exists, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /academic/sessions/{id}/activation:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: setAcademicSessionActivation
      tags: [academic-sessions]
      summary: Activate or deactivate an academic session
      description: Requires an active administrator, academic_sessions:activate, and the enabled academics module. Activating one session transactionally deactivates the previous session. The operation is idempotent.
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AcademicSessionActivationInput' } } } }
      responses:
        '200': { description: Session after activation change, content: { application/json: { schema: { $ref: '#/components/schemas/AcademicSessionResponse' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Read current role dashboard and allowed navigation
      description: Requires auth:read_self and the authentication module. Administrator statistics require the current admin role and users:read grant; other roles receive no statistics.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Dashboard, content: { application/json: { schema: { $ref: '#/components/schemas/DashboardResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /academic/classes:
    get:
      operationId: listAcademicClasses
      tags: [academic]
      summary: Search and page class definitions
      description: Requires academics:read and the academics module.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Search' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/AcademicStatus' }]
      responses: { '200': { description: Classes, content: { application/json: { schema: { $ref: '#/components/schemas/ClassPageResponse' } } } }, '400': { $ref: '#/components/responses/InvalidRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      operationId: createAcademicClass
      tags: [academic]
      summary: Create a class
      description: Requires academics:manage, an administrator account, and the academics module.
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClassInput' } } } }
      responses: { '201': { description: Created class, content: { application/json: { schema: { $ref: '#/components/schemas/ClassResponse' } } } }, '400': { $ref: '#/components/responses/InvalidRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/AcademicConflict' } }
  /academic/classes/{id}:
    parameters: [{ $ref: '#/components/parameters/AcademicId' }]
    get:
      operationId: getAcademicClass
      tags: [academic]
      summary: Get a class
      description: Requires academics:read and the academics module.
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Class, content: { application/json: { schema: { $ref: '#/components/schemas/ClassResponse' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      operationId: updateAcademicClass
      tags: [academic]
      summary: Update a class
      description: Requires academics:manage, an administrator account, and the academics module. All editable fields are required.
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClassInput' } } } }
      responses: { '200': { description: Updated class, content: { application/json: { schema: { $ref: '#/components/schemas/ClassResponse' } } } }, '400': { $ref: '#/components/responses/InvalidRequest' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/AcademicConflict' } }
  /academic/subjects:
    get:
      operationId: listAcademicSubjects
