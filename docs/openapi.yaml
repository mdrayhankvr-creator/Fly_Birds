      responses: { '200': { description: Publication state changed }, '409': { description: Empty draft }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /routines/exams/{id}/slots:
    post:
      operationId: createExamRoutineSlot
