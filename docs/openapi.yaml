      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Draft deleted }, '409': { description: Published or locked } }
  /exams/{id}/subjects:
    post:
      operationId: saveExamSubject
      summary: Add or update mapped subject full and pass marks
      description: Requires exams:manage and administrator role; only draft exams can change.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExamSubjectInput' } } } }
      responses: { '200': { description: Subject saved }, '400': { description: Invalid subject or marks }, '409': { description: More than one fourth subject } }
  /exams/{id}/subjects/{subjectId}:
    delete:
      operationId: deleteExamSubject
      summary: Remove a subject and its draft marks
      description: Requires exams:manage and administrator role.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: subjectId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Subject removed }, '409': { description: Published or locked } }
  /exams/{id}/roster:
    get:
      operationId: getExamMarksRoster
      summary: Inspect students and marks for every exam subject
      description: Requires exams:read and examinations module.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Marks roster } }
  /exams/{id}/assigned-roster:
    get:
      operationId: getAssignedMarksRoster
      summary: Inspect only subjects assigned to the signed-in teacher
      description: Requires exams:enter_marks and current teacher assignment.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Assigned marks roster }, '403': { description: No assignment } }
  /exams/{id}/marks:
    put:
      operationId: saveExamMarks
      summary: Enter or correct up to 500 marks atomically
      description: Requires exams:enter_marks and examinations module. Teachers are restricted to current subject assignments; administrators may correct all draft marks. Each change is audited.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExamMarksInput' } } } }
      responses: { '200': { description: Marks saved }, '400': { description: Invalid or duplicate entries }, '403': { description: Subject not assigned }, '409': { description: Exam is published or locked } }
  /exams/{id}/state:
    patch:
      operationId: setExamState
      summary: Publish, unpublish, or lock exam results
      description: Requires exams:manage and administrator role. Publication requires complete marks for every active eligible student and uses the current school grading scheme. Locked results cannot be changed.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [draft, published, locked] } } } } } }
      responses: { '200': { description: Exam state changed }, '409': { description: Incomplete marks or locked exam } }
  /exams/{id}/tabulation:
    get:
      operationId: getExamTabulation
      summary: Class and section merit positions and GPA tabulation
      description: Requires exams:read and examinations module.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Tabulation sheet } }
  /exams/{id}/results/{studentId}:
    get:
      operationId: getExamStudentResult
      summary: Inspect a student's calculated report card
      description: Requires exams:read and examinations module.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: studentId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Report card }, '404': { description: Result unavailable } }
  /fees/options:
    get:
      operationId: getFeeOptions
      summary: List sessions, classes, active sections and active fee categories for fee screens
      description: Requires fees:read and the fees module, so accountants need no academic grants.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Lookup lists }, '403': { description: Permission or module denied } }
  /fees/students:
    get:
      operationId: searchFeeStudents
      summary: Search students by admission number or name for fee collection
      description: Requires fees:read and the fees module. Returns minimal identity and class context only.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Search' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/FeeSession' }, { $ref: '#/components/parameters/FeeClass' }, { name: section_id, in: query, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Paginated students } }
  /fees/students/{id}/statement:
    get:
      operationId: getStudentFeeStatement
      summary: Read a student's dues, payments and totals including arrears
      description: Requires fees:read and the fees module.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/FeeId' }]
      responses: { '200': { description: Fee statement, content: { application/json: { schema: { $ref: '#/components/schemas/FeeStatement' } } } }, '404': { description: Unknown student } }
  /fees/categories:
    get:
      operationId: listFeeCategories
      summary: List fee categories
      description: Requires fees:read and the fees module.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Search' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses: { '200': { description: Paginated categories } }
    post:
      operationId: createFeeCategory
      summary: Create a monthly or one-time fee category
      description: Requires fees:manage, admin or accountant role, and the fees module. Codes are unique upper-case identifiers.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FeeCategoryInput' } } } }
      responses: { '201': { description: Category created }, '400': { description: Invalid input }, '409': { description: Duplicate code } }
  /fees/categories/{id}:
    patch:
      operationId: updateFeeCategory
      summary: Rename or deactivate a fee category
      description: Requires fees:manage and admin or accountant role. Code and frequency are fixed once a structure uses the category.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/FeeId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FeeCategoryInput' } } } }
      responses: { '200': { description: Category updated }, '409': { description: Code or frequency in use } }
  /fees/structures:
    get:
      operationId: listFeeStructures
      summary: List configured fee amounts by session, class and category
      description: Requires fees:read and the fees module.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/FeeSession' }, { $ref: '#/components/parameters/FeeClass' }, { name: category_id, in: query, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses: { '200': { description: Paginated structures } }
    post:
      operationId: createFeeStructure
      summary: Configure a fee amount and due day for a session and class
      description: Requires fees:manage and admin or accountant role. One structure per session, class and category.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FeeStructureInput' } } } }
      responses: { '201': { description: Structure created }, '400': { description: Invalid context or inactive category }, '409': { description: Duplicate structure } }
  /fees/structures/{id}:
    patch:
      operationId: updateFeeStructure
      summary: Change a structure amount, due day or active state
      description: Requires fees:manage and admin or accountant role. Session, class and category are fixed; existing dues keep their snapshot amount.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/FeeId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FeeStructureInput' } } } }
      responses: { '200': { description: Structure updated }, '409': { description: Context change rejected } }
  /fees/concessions:
    get:
      operationId: listFeeConcessions
      summary: List standing student concessions
      description: Requires fees:read and the fees module.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: student_id, in: query, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/Search' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses: { '200': { description: Paginated concessions } }
    post:
      operationId: saveFeeConcession
      summary: Create or replace a student's percentage concession for one category
      description: Requires fees:manage and admin or accountant role. Applies to dues created afterwards and is recorded as a discount adjustment.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FeeConcessionInput' } } } }
      responses: { '200': { description: Concession saved }, '400': { description: Invalid input } }
  /fees/concessions/{id}:
    delete:
      operationId: deleteFeeConcession
      summary: Remove a standing concession
      description: Requires fees:manage and admin or accountant role. Existing dues are unchanged.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/FeeId' }]
      responses: { '200': { description: Deleted }, '404': { description: Unknown concession } }
  /fees/dues:
    get:
      operationId: listStudentDues
      summary: List student dues with balance, status and overdue flag
      description: Requires fees:read and the fees module. Status overdue means an unpaid balance past its due date (arrears).
      tags: [fees]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/FeeSession' }, { $ref: '#/components/parameters/FeeClass' }, { name: section_id, in: query, schema: { type: string, format: uuid } }, { name: student_id, in: query, schema: { type: string, format: uuid } }, { name: category_id, in: query, schema: { type: string, format: uuid } }, { name: period, in: query, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }, { name: status, in: query, schema: { type: string, enum: [unpaid, partial, paid, waived, outstanding, overdue] } }, { $ref: '#/components/parameters/Search' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses: { '200': { description: Paginated dues } }
    post:
      operationId: assignStudentDue
      summary: Assign one fee structure to one student
      description: Requires fees:manage and admin or accountant role. The structure must match the student's session and class; monthly fees need a period inside the session.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FeeDueInput' } } } }
      responses: { '201': { description: Due created }, '400': { description: Invalid context or period }, '409': { description: Already assigned or inactive structure } }
  /fees/dues/generate:
    post:
      operationId: generateMonthlyDues
      summary: Generate dues for every active student in a session or class for one month
      description: Requires fees:manage and admin or accountant role. Rerunning skips dues that already exist.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FeeGenerateInput' } } } }
      responses: { '200': { description: Created and skipped counts }, '400': { description: Period outside session } }
  /fees/dues/{id}:
    delete:
      operationId: deleteStudentDue
      summary: Delete a mistaken due that has no payments
      description: Requires fees:manage and admin or accountant role.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/FeeId' }]
      responses: { '200': { description: Deleted }, '409': { description: Payments exist } }
  /fees/dues/{id}/adjustments:
    get:
      operationId: listDueAdjustments
      summary: List discounts and waivers applied to a due
      description: Requires fees:read and the fees module.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/FeeId' }]
      responses: { '200': { description: Adjustments } }
    post:
      operationId: adjustStudentDue
      summary: Apply a discount or waive the remaining balance
      description: Requires fees:manage and admin or accountant role. Waivers are administrator-only and write off exactly the remaining balance; discounts cannot exceed it.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/FeeId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FeeAdjustmentInput' } } } }
      responses: { '200': { description: Updated due }, '403': { description: Waiver by non-administrator }, '409': { description: Exceeds balance or already settled } }
  /fees/payments:
    get:
      operationId: listFeePayments
      summary: List receipts by date range, method, class or search
      description: Requires fees:read and the fees module.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/FeeFrom' }, { $ref: '#/components/parameters/FeeTo' }, { $ref: '#/components/parameters/FeeMethod' }, { $ref: '#/components/parameters/FeeClass' }, { name: student_id, in: query, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/Search' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses: { '200': { description: Paginated payments } }
    post:
      operationId: recordFeePayment
      summary: Record a full or partial payment and issue a receipt
      description: Requires fees:collect and admin or accountant role. The amount settles the oldest selected dues first and cannot exceed their balance. Reusing idempotency_key returns the original receipt with 200; bank, bKash and Nagad references must be unique.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FeePaymentInput' } } } }
      responses: { '201': { description: Receipt issued, content: { application/json: { schema: { $ref: '#/components/schemas/FeeReceipt' } } } }, '200': { description: Idempotent replay of the original receipt }, '409': { description: overpayment or duplicate_payment } }
  /fees/payments/{id}:
    get:
      operationId: getFeeReceipt
      summary: Read a printable receipt
      description: Requires fees:read and the fees module.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/FeeId' }]
      responses: { '200': { description: Receipt, content: { application/json: { schema: { $ref: '#/components/schemas/FeeReceipt' } } } }, '404': { description: Unknown receipt } }
  /fees/reports/collections:
    get:
      operationId: getFeeCollectionReport
      summary: Fee collections by method, class, category and day
      description: Requires fees:read and the fees module. Defaults to the current month; ranges are limited to about two years.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/FeeFrom' }, { $ref: '#/components/parameters/FeeTo' }, { $ref: '#/components/parameters/FeeSession' }, { $ref: '#/components/parameters/FeeClass' }, { $ref: '#/components/parameters/FeeMethod' }]
      responses: { '200': { description: Collection report } }
  /fees/reports/dues:
    get:
      operationId: getFeeDueReport
      summary: Per-student outstanding balances and arrears
      description: Requires fees:read and the fees module. Sorted by arrears, then balance.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/FeeSession' }, { $ref: '#/components/parameters/FeeClass' }, { name: section_id, in: query, schema: { type: string, format: uuid } }, { name: overdue_only, in: query, schema: { type: boolean } }, { $ref: '#/components/parameters/Search' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses: { '200': { description: Paginated due report with totals } }
  /fees/me:
    get:
      operationId: getOwnFeeStatement
      summary: Read the signed-in student's fee statement
      description: Requires fees:read_self, student role and the fees module.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Fee statement, content: { application/json: { schema: { $ref: '#/components/schemas/FeeStatement' } } } }, '404': { description: No linked student } }
  /fees/me/payments/{id}:
    get:
      operationId: getOwnFeeReceipt
      summary: Read one of the signed-in student's receipts
      description: Requires fees:read_self and student role. Other students' receipts read as not found.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/FeeId' }]
      responses: { '200': { description: Receipt }, '404': { description: Not found or not owned } }
  /fees/children/{studentId}:
    get:
      operationId: getChildFeeStatement
      summary: Read a linked child's fee statement
      description: Requires fees:read_children, guardian role and a current guardian link.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: studentId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Fee statement }, '404': { description: Not linked } }
  /fees/children/{studentId}/payments/{id}:
    get:
      operationId: getChildFeeReceipt
      summary: Read one receipt for a linked child
      description: Requires fees:read_children, guardian role and a current guardian link.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: studentId, in: path, required: true, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/FeeId' }]
      responses: { '200': { description: Receipt }, '404': { description: Not linked or not owned } }
  /fees/online/intents:
    post:
      operationId: startMockMobilePayment
      summary: Start a mock bKash or Nagad checkout for own or linked child's dues
      description: Requires fees:pay_online and student or guardian role. Students may omit student_id. The mock gateway never contacts a real provider; the session expires after 15 minutes.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FeeIntentInput' } } } }
      responses: { '201': { description: Pending checkout with provider reference }, '404': { description: Not linked }, '409': { description: Amount exceeds outstanding balance } }
  /fees/online/intents/{id}/confirm:
    post:
      operationId: confirmMockMobilePayment
      summary: Confirm a mock checkout with the provider OTP and receive a receipt
      description: Requires fees:pay_online and the same payer. The mock gateway accepts only OTP 123456; any other OTP declines and closes the checkout. Repeated confirmation returns the same receipt.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/FeeId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [otp], properties: { otp: { type: string, maxLength: 12 } } } } } }
      responses: { '200': { description: Receipt }, '409': { description: payment_expired, fee_conflict or overpayment }, '422': { description: payment_declined } }
  /accounts/entries:
    get:
      operationId: listLedgerEntries
      summary: List income and expense ledger entries
      description: Requires accounts:read and the fees module. Fee receipts appear as income in category fees.
      tags: [accounts]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: type, in: query, schema: { type: string, enum: [income, expense] } }, { name: category, in: query, schema: { type: string } }, { $ref: '#/components/parameters/FeeFrom' }, { $ref: '#/components/parameters/FeeTo' }, { $ref: '#/components/parameters/Search' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses: { '200': { description: Paginated entries } }
    post:
      operationId: createLedgerEntry
      summary: Record a manual income or expense
      description: Requires accounts:manage and admin or accountant role. Category fees is reserved for receipts; dates cannot be in the future.
      tags: [accounts]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LedgerEntryInput' } } } }
      responses: { '201': { description: Entry recorded }, '400': { description: Invalid category, amount or date } }
  /accounts/entries/{id}:
    delete:
      operationId: deleteLedgerEntry
      summary: Remove a manual ledger entry
      description: Requires accounts:manage and admin or accountant role. Fee income linked to a receipt cannot be removed.
      tags: [accounts]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/FeeId' }]
      responses: { '200': { description: Deleted }, '409': { description: Linked to a receipt } }
  /accounts/summary:
    get:
      operationId: getAccountingSummary
      summary: Income, expense and net by category with outstanding dues and arrears
      description: Requires accounts:read and the fees module. Defaults to the current month.
      tags: [accounts]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/FeeFrom' }, { $ref: '#/components/parameters/FeeTo' }]
      responses: { '200': { description: Accounting summary } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Search: { name: search, in: query, schema: { type: string, maxLength: 100 }, description: Case-insensitive ID or label search }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
    RoleId: { name: id, in: path, required: true, schema: { type: string }, description: One of the six role identifiers }
    UserId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    AcademicId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    AcademicStatus: { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
    FeeId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    FeeSession: { name: session_id, in: query, schema: { type: string, format: uuid } }
    FeeClass: { name: class_id, in: query, schema: { type: string, format: uuid } }
    FeeFrom: { name: from, in: query, schema: { type: string, format: date } }
    FeeTo: { name: to, in: query, schema: { type: string, format: date } }
    FeeMethod: { name: method, in: query, schema: { type: string, enum: [cash, bank, bkash, nagad] } }
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
  responses:
    AcademicConflict: { description: Duplicate class, subject code, assignment, or inactive assignment target }
    IDList:
      description: Current identifiers
      content:
        application/json:
          schema: { $ref: '#/components/schemas/IDListResponse' }
    NotFound:
      description: Requested resource does not exist
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    LastAdmin:
      description: Change would remove the last authorized administrator
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InvalidRequest:
      description: Invalid JSON or request data
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InvalidCredentials:
      description: Generic incorrect credentials response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InvalidSession:
      description: Session is missing, expired, or revoked
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Access token is missing or invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Permission denied
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UnsupportedMediaType:
      description: Login requires application/json
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    AuthUnavailable:
      description: Authentication requires a configured database
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    FeeCategoryInput:
      type: object
      required: [code, name_en, frequency]
      properties:
        code: { type: string, pattern: '^[A-Z0-9_-]{2,20}$' }
        name_en: { type: string, maxLength: 120 }
        name_bn: { type: string }
        frequency: { type: string, enum: [monthly, one_time] }
        is_active: { type: boolean, default: true }
    FeeStructureInput:
      type: object
      required: [session_id, class_id, category_id, amount]
      properties:
        session_id: { type: string, format: uuid }
        class_id: { type: string, format: uuid }
        category_id: { type: string, format: uuid }
        amount: { type: number, minimum: 0.01, maximum: 10000000, description: Taka with at most two decimals }
        due_day: { type: integer, minimum: 1, maximum: 28, default: 10 }
        is_active: { type: boolean, default: true }
    FeeConcessionInput:
      type: object
      required: [student_id, category_id, percent, reason]
      properties:
        student_id: { type: string, format: uuid }
        category_id: { type: string, format: uuid }
        percent: { type: number, minimum: 0.01, maximum: 100 }
        reason: { type: string, maxLength: 240 }
    FeeDueInput:
      type: object
      required: [student_id, structure_id]
      properties:
        student_id: { type: string, format: uuid }
        structure_id: { type: string, format: uuid }
        period: { type: string, pattern: '^\d{4}-\d{2}$', description: Required for monthly fees; sets the due month for one-time fees }
    FeeGenerateInput:
      type: object
      required: [session_id, period]
      properties:
        session_id: { type: string, format: uuid }
        class_id: { type: string, format: uuid, description: Omit for every class in the session }
        period: { type: string, pattern: '^\d{4}-\d{2}$' }
        include_one_time: { type: boolean, default: false }
    FeeAdjustmentInput:
      type: object
      required: [kind, reason]
      properties:
        kind: { type: string, enum: [discount, waiver] }
        amount: { type: number, description: Required for discounts; ignored for waivers }
        reason: { type: string, maxLength: 240 }
    FeePaymentInput:
      type: object
      required: [student_id, amount, method, idempotency_key]
      properties:
        student_id: { type: string, format: uuid }
        amount: { type: number, minimum: 0.01 }
        method: { type: string, enum: [cash, bank, bkash, nagad] }
        reference: { type: string, maxLength: 80, description: Required except for cash }
        paid_on: { type: string, format: date, description: Defaults to today in Bangladesh time; cannot be in the future }
        note: { type: string, maxLength: 240 }
        idempotency_key: { type: string, format: uuid, description: One key per payment attempt }
        fee_ids: { type: array, maxItems: 200, items: { type: string, format: uuid }, description: Optional dues to settle; defaults to all outstanding dues, oldest first }
    FeeIntentInput:
      type: object
      required: [provider, amount]
      properties:
        student_id: { type: string, format: uuid, description: Required for guardians }
        provider: { type: string, enum: [bkash, nagad] }
        amount: { type: number, minimum: 0.01 }
    LedgerEntryInput:
      type: object
      required: [entry_type, category, amount, entry_date, description]
      properties:
        entry_type: { type: string, enum: [income, expense] }
        category: { type: string, enum: [donation, grant, other_income, salary, utilities, supplies, maintenance, transport, events, other_expense] }
        amount: { type: number, minimum: 0.01 }
        entry_date: { type: string, format: date }
        description: { type: string, maxLength: 240 }
        reference: { type: string, maxLength: 80 }
    FeeDue:
      type: object
      properties:
        id: { type: string, format: uuid }
        student_id: { type: string, format: uuid }
        period: { type: string, nullable: true }
        due_date: { type: string, format: date }
        amount: { type: number }
        discount_amount: { type: number }
        paid_amount: { type: number }
        balance: { type: number }
        status: { type: string, enum: [unpaid, partial, paid, waived] }
        overdue: { type: boolean }
        category_code: { type: string }
        category_name_en: { type: string }
        category_name_bn: { type: string }
    FeeReceipt:
      type: object
      properties:
        data:
          type: object
          properties:
            payment: { type: object, description: Receipt number, student, amount, method, reference, date and collector }
            allocations: { type: array, items: { type: object, properties: { student_fee_id: { type: string }, amount: { type: number }, category_name_en: { type: string }, period: { type: string, nullable: true } } } }
            balance_after: { type: number, description: Student's current outstanding balance }
            replayed: { type: boolean }
    FeeStatement:
      type: object
      properties:
        data:
          type: object
          properties:
            student: { type: object }
            dues: { type: array, items: { $ref: '#/components/schemas/FeeDue' } }
            payments: { type: array, items: { type: object } }
            totals: { type: object, properties: { charged: { type: number }, discount: { type: number }, paid: { type: number }, balance: { type: number }, overdue: { type: number } } }
    ExamInput:
      type: object
      required: [name, exam_type, session_id, class_id, section_id]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        exam_type: { type: string, enum: [class_test, half_yearly, annual, other] }
        session_id: { type: string, format: uuid }
        class_id: { type: string, format: uuid }
        section_id: { type: string, format: uuid }
        routine_id: { type: string, format: uuid, nullable: true }
    ExamSubjectInput:
      type: object
      required: [subject_id, full_marks, pass_marks]
      properties:
        subject_id: { type: string, format: uuid }
        full_marks: { type: number, minimum: 0.01, maximum: 1000, multipleOf: 0.01 }
        pass_marks: { type: number, minimum: 0, multipleOf: 0.01 }
    ExamMarksInput:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [exam_subject_id, student_id, marks]
            properties:
              exam_subject_id: { type: string, format: uuid }
              student_id: { type: string, format: uuid }
              marks: { type: number, minimum: 0, multipleOf: 0.01 }
    ClassRoutineInput:
      type: object
      required: [session_id, class_id, section_id, subject_id, teacher_id, day_of_week, start_time, end_time, room]
      properties:
        session_id: { type: string, format: uuid }
        class_id: { type: string, format: uuid }
        section_id: { type: string, format: uuid }
        subject_id: { type: string, format: uuid }
        teacher_id: { type: string, format: uuid }
        day_of_week: { type: integer, minimum: 0, maximum: 6, description: '0 is Sunday; 6 is Saturday.' }
        start_time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        end_time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        room: { type: string, minLength: 1, maxLength: 80 }
    ExamRoutineInput:
      type: object
      required: [name, session_id, class_id, section_id]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        session_id: { type: string, format: uuid }
        class_id: { type: string, format: uuid }
        section_id: { type: string, format: uuid }
    ExamRoutineSlotInput:
      type: object
      required: [subject_id, exam_date, start_time, end_time, room]
      properties:
        subject_id: { type: string, format: uuid }
        exam_date: { type: string, format: date }
        start_time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        end_time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        room: { type: string, minLength: 1, maxLength: 80 }
    StudentAttendanceInput:
      type: object
      required: [student_id, attendance_date, status]
      properties:
        student_id: { type: string, format: uuid }
        attendance_date: { type: string, format: date }
        status: { type: string, enum: [present, absent, late] }
        note: { type: string, maxLength: 500 }
    StudentAttendanceScan:
      type: object
      required: [payload, attendance_date]
      properties:
        payload: { type: string, description: M3 FB-STUDENT card QR identifier; never an authorization token }
        attendance_date: { type: string, format: date }
    StudentAttendanceCorrection:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [present, absent, late] }
        note: { type: string, maxLength: 500 }
    TeacherAttendanceInput:
      type: object
      required: [session_id, employee_id, attendance_date, status]
      properties:
        session_id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        attendance_date: { type: string, format: date }
        status: { type: string, enum: [present, absent, leave] }
        note: { type: string, maxLength: 500 }
    TeacherAttendanceCorrection:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [present, absent, leave] }
        note: { type: string, maxLength: 500 }
    EmployeeInput:
      type: object
      required: [employee_code, kind, name_en, designation, joined_on]
      properties:
        employee_code: { type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{1,31}$' }
        user_id: { type: string, format: uuid, nullable: true }
        kind: { type: string, enum: [teacher, non_teaching] }
        name_en: { type: string, maxLength: 160 }
        name_bn: { type: string, maxLength: 160 }
        designation: { type: string, maxLength: 120 }
        phone: { type: string, maxLength: 32 }
        joined_on: { type: string, format: date }
        left_on: { type: string, format: date, nullable: true }
        is_active: { type: boolean }
    AssignmentInput:
      type: object
      required: [session_id, class_id, subject_id]
      properties:
        session_id: { type: string, format: uuid }
        class_id: { type: string, format: uuid }
        subject_id: { type: string, format: uuid }
    LeaveInput:
      type: object
      required: [starts_on, ends_on, leave_type]
      properties:
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date }
        leave_type: { type: string, enum: [casual, sick, annual, other] }
        reason: { type: string, maxLength: 1000 }
    SalaryInput:
      type: object
      required: [effective_on, basic_bdt]
      properties:
        effective_on: { type: string, format: date }
        basic_bdt: { type: string, pattern: '^[0-9]+(\.[0-9]{1,2})?$' }
        allowance_bdt: { type: string, pattern: '^[0-9]+(\.[0-9]{1,2})?$' }
        deduction_bdt: { type: string, pattern: '^[0-9]+(\.[0-9]{1,2})?$' }
        note: { type: string, maxLength: 500 }
    StudentInput:
      type: object
      required: [admission_no, name_en, status, session_id, class_id, section_id]
      properties:
        admission_no: { type: string, maxLength: 64 }
        name_en: { type: string, maxLength: 160 }
        name_bn: { type: string, maxLength: 160 }
        date_of_birth: { type: string, format: date, nullable: true }
        status: { type: string, enum: [active, inactive, graduated, transferred] }
        session_id: { type: string, format: uuid }
        class_id: { type: string, format: uuid }
        section_id: { type: string, format: uuid }
        roll_no: { type: integer, minimum: 1, maximum: 999999, nullable: true }
        user_id: { type: string, format: uuid, nullable: true, description: Must reference a student-role user }
    Student:
      allOf: [{ $ref: '#/components/schemas/StudentInput' }, { type: object, required: [id], properties: { id: { type: string, format: uuid }, session_name: { type: string }, class_name: { type: string }, section_name: { type: string }, has_photo: { type: boolean } } }]
    StudentResponse: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Student' } } }
    StudentCardResponse: { type: object, required: [data], properties: { data: { type: object, required: [student, qr_payload, qr_data_url], properties: { student: { $ref: '#/components/schemas/Student' }, qr_payload: { type: string }, qr_data_url: { type: string, description: Base64 PNG data URL } } } } }
    StudentPageResponse: { type: object, required: [data], properties: { data: { type: object, required: [items, total, page, page_size], properties: { items: { type: array, items: { $ref: '#/components/schemas/Student' } }, total: { type: integer }, page: { type: integer }, page_size: { type: integer } } } } }
    GuardianInput:
      type: object
      required: [name_en]
      properties:
        name_en: { type: string, maxLength: 160 }
        name_bn: { type: string, maxLength: 160 }
        phone: { type: string, maxLength: 32 }
        email: { type: string, maxLength: 254 }
        address: { type: string, maxLength: 500 }
        user_id: { type: string, format: uuid, nullable: true, description: Must reference a guardian-role user }
    Guardian:
      allOf: [{ $ref: '#/components/schemas/GuardianInput' }, { type: object, required: [id], properties: { id: { type: string, format: uuid } } }]
    GuardianResponse: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Guardian' } } }
    GuardianPageResponse: { type: object, required: [data], properties: { data: { type: object, required: [items, total, page, page_size], properties: { items: { type: array, items: { $ref: '#/components/schemas/Guardian' } }, total: { type: integer }, page: { type: integer }, page_size: { type: integer } } } } }
    RelationshipInput:
      type: object
      required: [guardian_id, relationship, is_primary]
      properties:
        guardian_id: { type: string, format: uuid }
        relationship: { type: string, maxLength: 60 }
        is_primary: { type: boolean }
    ClassInput:
      type: object
      required: [name, display_order, is_active]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        display_order: { type: integer, minimum: 0, maximum: 100000 }
        is_active: { type: boolean }
    AcademicClass:
      allOf: [{ $ref: '#/components/schemas/ClassInput' }, { type: object, required: [id], properties: { id: { type: string, format: uuid } } }]
    ClassResponse: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/AcademicClass' } } }
    ClassPageResponse: { type: object, required: [data], properties: { data: { type: object, required: [items, total, page, page_size], properties: { items: { type: array, items: { $ref: '#/components/schemas/AcademicClass' } }, total: { type: integer }, page: { type: integer }, page_size: { type: integer } } } } }
    SectionInput:
      type: object
      required: [session_id, class_id, name, code, display_order, is_active]
      properties:
        session_id: { type: string, format: uuid }
        class_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        code: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,31}$' }
        display_order: { type: integer, minimum: 0, maximum: 100000 }
        is_active: { type: boolean }
    AcademicSection:
      allOf: [{ $ref: '#/components/schemas/SectionInput' }, { type: object, required: [id, session_name, class_name], properties: { id: { type: string, format: uuid }, session_name: { type: string }, class_name: { type: string } } }]
    SectionResponse: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/AcademicSection' } } }
    SectionPageResponse: { type: object, required: [data], properties: { data: { type: object, required: [items, total, page, page_size], properties: { items: { type: array, items: { $ref: '#/components/schemas/AcademicSection' } }, total: { type: integer }, page: { type: integer }, page_size: { type: integer } } } } }
    SubjectInput:
      type: object
      required: [name_en, name_bn, code, is_active]
      properties:
        name_en: { type: string, minLength: 1, maxLength: 160 }
        name_bn: { type: string, minLength: 1, maxLength: 160 }
        code: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,31}$' }
        is_active: { type: boolean }
    AcademicSubject:
      allOf: [{ $ref: '#/components/schemas/SubjectInput' }, { type: object, required: [id], properties: { id: { type: string, format: uuid } } }]
    SubjectResponse: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/AcademicSubject' } } }
    SubjectPageResponse: { type: object, required: [data], properties: { data: { type: object, required: [items, total, page, page_size], properties: { items: { type: array, items: { $ref: '#/components/schemas/AcademicSubject' } }, total: { type: integer }, page: { type: integer }, page_size: { type: integer } } } } }
    MappingFlags:
      type: object
      required: [is_required, is_fourth_subject]
      oneOf:
        - properties: { is_required: { enum: [true] }, is_fourth_subject: { enum: [false] } }
        - properties: { is_required: { enum: [false] }, is_fourth_subject: { enum: [true] } }
    MappingInput:
      allOf: [{ $ref: '#/components/schemas/MappingFlags' }, { type: object, required: [subject_id], properties: { subject_id: { type: string, format: uuid } } }]
    ClassSubject:
      type: object
      required: [id, class_id, subject_id, is_required, is_fourth_subject, subject_name_en, subject_name_bn, subject_code]
      properties:
        id: { type: string, format: uuid }
        class_id: { type: string, format: uuid }
        subject_id: { type: string, format: uuid }
        is_required: { type: boolean }
        is_fourth_subject: { type: boolean }
        subject_name_en: { type: string }
        subject_name_bn: { type: string }
        subject_code: { type: string }
    MappingResponse: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/ClassSubject' } } }
    MappingPageResponse: { type: object, required: [data], properties: { data: { type: object, required: [items, total, page, page_size], properties: { items: { type: array, items: { $ref: '#/components/schemas/ClassSubject' } }, total: { type: integer }, page: { type: integer }, page_size: { type: integer } } } } }
    AcademicSession:
      type: object
      required: [id, name, start_date, end_date, is_active, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: '2026–2027' }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AcademicSessionInput:
      type: object
      required: [name, start_date, end_date]
      additionalProperties: false
      properties:
        name: { type: string, pattern: '^[0-9]{4}([-–][0-9]{4})?$', description: A year or two consecutive years }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date, description: Must be after start_date }
    AcademicSessionActivationInput:
      type: object
      required: [is_active]
      additionalProperties: false
      properties:
        is_active: { type: boolean }
    AcademicSessionResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/AcademicSession' }
    AcademicSessionPageResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [items, total, page, page_size]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/AcademicSession' } }
            total: { type: integer }
            page: { type: integer }
            page_size: { type: integer }
    ManagedUser:
      type: object
      required: [id, email, display_name, role, is_active]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        role: { type: string, enum: [admin, head_teacher, teacher, student, guardian, accountant] }
        is_active: { type: boolean }
    ManagedUserResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ManagedUser' }
    UserPageResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [items, total, page, page_size]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/ManagedUser' } }
            total: { type: integer }
            page: { type: integer }
            page_size: { type: integer }
    CreateUserInput:
      type: object
      required: [email, display_name, role, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        display_name: { type: string, minLength: 1, maxLength: 160 }
        role: { type: string, enum: [admin, head_teacher, teacher, student, guardian, accountant] }
        password: { type: string, format: password, description: 12 to 72 UTF-8 bytes }
    UpdateUserInput:
      type: object
      required: [email, display_name]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        display_name: { type: string, minLength: 1, maxLength: 160 }
    StatusInput:
      type: object
      required: [is_active]
      additionalProperties: false
      properties:
        is_active: { type: boolean }
    AuditEvent:
      type: object
      required: [id, created_at, action, target_type, target_id, outcome, metadata]
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        actor_user_id: { type: string, format: uuid, nullable: true }
        action: { type: string }
        target_type: { type: string }
        target_id: { type: string }
        outcome: { type: string, enum: [success, denied] }
        metadata: { type: object, description: Explicit safe metadata only; no credentials or token material }
    AuditPageResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [items, total, page, page_size]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
            total: { type: integer }
            page: { type: integer }
            page_size: { type: integer }
    DashboardNavigation:
      type: object
      required: [key, name, path, coming_soon]
      properties:
        key: { type: string }
        name: { type: string }
        path: { type: string }
        coming_soon: { type: boolean }
    DashboardResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [user, branding, navigation]
          properties:
            user: { $ref: '#/components/schemas/AuthUser' }
            branding: { $ref: '#/components/schemas/Branding' }
            navigation: { type: array, items: { $ref: '#/components/schemas/DashboardNavigation' } }
            summary:
              type: object
              description: Present only for administrators with users:read.
              properties:
                total_users: { type: integer }
                active_users: { type: integer }
                inactive_users: { type: integer }
                by_role: { type: array, items: { type: object, properties: { role: { type: string }, count: { type: integer } } } }
                enabled_modules: { type: integer }
                school_fields_complete: { type: integer }
                school_fields_total: { type: integer }
    Branding:
      type: object
      required: [name_en, name_bn, logo_url, preferred_language, primary_color, secondary_color, dashboard_theme]
      properties:
        name_en: { type: string }
        name_bn: { type: string }
        logo_url: { type: string, description: Optional HTTPS PNG, JPEG, or WebP URL }
        preferred_language: { type: string, enum: [en, bn] }
        primary_color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        secondary_color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        dashboard_theme: { type: string, enum: [light, dark] }
    BrandingResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Branding' }
    SchoolSettingsInput:
      allOf: [{ $ref: '#/components/schemas/Branding' }]
      type: object
      required: [address, phone, email, grading_scheme_id]
      properties:
        address: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        grading_scheme_id: { type: string, example: bd_default }
    SchoolSettings:
      allOf: [{ $ref: '#/components/schemas/SchoolSettingsInput' }]
      type: object
      properties:
        updated_at: { type: string, format: date-time }
    SchoolSettingsResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/SchoolSettings' }
    GradeBand:
      type: object
      required: [grade, min_marks, max_marks, gpa]
      properties:
        grade: { type: string }
        min_marks: { type: integer, minimum: 0, maximum: 100 }
        max_marks: { type: integer, minimum: 0, maximum: 100 }
        gpa: { type: number, minimum: 0, maximum: 5, multipleOf: 0.01 }
    GradingInput:
      type: object
      required: [bands]
      additionalProperties: false
      properties:
        bands: { type: array, minItems: 1, maxItems: 30, items: { $ref: '#/components/schemas/GradeBand' } }
    GradingResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/GradeBand' } }
    SchoolModule:
      type: object
      required: [key, name, is_core, enabled]
      properties:
        key: { type: string }
        name: { type: string }
        is_core: { type: boolean }
        enabled: { type: boolean }
    ModuleResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/SchoolModule' }
    ModulePageResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [items, total, page, page_size]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/SchoolModule' } }
            total: { type: integer }
            page: { type: integer }
            page_size: { type: integer }
    IDListRequest:
      type: object
      required: [ids]
      additionalProperties: false
      properties:
        ids: { type: array, uniqueItems: true, items: { type: string } }
    SingleRoleRequest:
      allOf: [{ $ref: '#/components/schemas/IDListRequest' }]
      description: The ids array must contain exactly one role identifier.
    IDListResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { type: string } }
    RolePageResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [items, total, page, page_size]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Role' } }
            total: { type: integer }
            page: { type: integer }
            page_size: { type: integer }
    PermissionPageResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [items, total, page, page_size]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Permission' } }
            total: { type: integer }
            page: { type: integer }
            page_size: { type: integer }
    Role:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    Permission:
      type: object
      required: [id, description]
      properties:
        id: { type: string }
        description: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password, minLength: 1, maxLength: 72 }
    AuthUser:
      type: object
      required: [id, email, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        role:
          type: string
          enum: [admin, head_teacher, teacher, student, guardian, accountant]
    AuthResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [user, access_token]
          properties:
            user: { $ref: '#/components/schemas/AuthUser' }
            access_token: { type: string, description: JWT access token; expires in 15 minutes }
    UserResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/AuthUser' }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
    HealthResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [ok]
