      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SubjectInput' } } } }
      responses: { '201': { description: Created subject, content: { application/json: { schema: { $ref: '#/components/schemas/SubjectResponse' } } } }, '400': { $ref: '#/components/responses/InvalidRequest' }, '409': { $ref: '#/components/responses/AcademicConflict' } }
  /academic/subjects/{id}:
    parameters: [{ $ref: '#/components/parameters/AcademicId' }]
    get:
      operationId: getAcademicSubject
      tags: [academic]
      summary: Get a subject
      description: Requires academics:read and the academics module.
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Subject, content: { application/json: { schema: { $ref: '#/components/schemas/SubjectResponse' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      operationId: updateAcademicSubject
      tags: [academic]
      summary: Update a subject
      description: Requires academics:manage, an administrator account, and the academics module. All editable fields are required.
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SubjectInput' } } } }
      responses: { '200': { description: Updated subject, content: { application/json: { schema: { $ref: '#/components/schemas/SubjectResponse' } } } }, '400': { $ref: '#/components/responses/InvalidRequest' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/AcademicConflict' } }
  /academic/classes/{id}/subjects:
    parameters: [{ $ref: '#/components/parameters/AcademicId' }]
    get:
      operationId: listClassSubjects
      tags: [academic]
      summary: Search and page subjects assigned to a class
      description: Requires academics:read and the academics module.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Search' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses: { '200': { description: Class subjects, content: { application/json: { schema: { $ref: '#/components/schemas/MappingPageResponse' } } } }, '400': { $ref: '#/components/responses/InvalidRequest' }, '404': { $ref: '#/components/responses/NotFound' } }
    post:
      operationId: assignClassSubject
