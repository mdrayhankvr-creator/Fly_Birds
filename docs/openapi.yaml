      summary: Delete a subject exam from an unpublished routine
      description: Requires routine:manage and administrator role.
      tags: [routine]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: slotId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Slot deleted }, '409': { description: Published routine }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /exams:
    get:
      operationId: listExams
      summary: List exams with session, class, section, search and page filters
      description: Requires exams:read and enabled examinations module; administrators and head teachers can inspect drafts.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Paginated exams }, '403': { description: Permission or module denied }, '401': { $ref: '#/components/responses/Unauthorized' } }
    post:
      operationId: createExam
      summary: Create a draft exam for a valid academic section
      description: Requires exams:manage, administrator role, and examinations module. Optional routine_id must match the same session, class and section.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExamInput' } } } }
      responses: { '201': { description: Draft created }, '400': { description: Invalid context }, '409': { description: Duplicate name }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /exams/assigned:
    get:
      operationId: listAssignedExams
      summary: List exams with subjects assigned to the signed-in teacher
      description: Requires exams:enter_marks, teacher role and examinations module.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Paginated assigned exams }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /exams/assigned/{id}:
    get:
      operationId: getAssignedExam
      summary: Read one exam assigned to the teacher
      description: Requires exams:enter_marks, teacher role and a current subject assignment.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Exam and subjects }, '403': { description: No assignment }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /exams/me/results:
    get:
      operationId: listOwnResults
      summary: List signed-in student's published report cards
      description: Requires exams:read_self and examinations module. Drafts are hidden. Each subject row includes subject_name and subject_name_bn.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Published report cards }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /exams/me/results/{examId}:
    get:
      operationId: getOwnResult
      summary: Read one published student report card
      description: Requires exams:read_self and a linked student account.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: examId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Report card }, '404': { description: Unavailable result }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /exams/children/{studentId}/results:
    get:
      operationId: listChildResults
      summary: List a linked child's published report cards
      description: Requires exams:read_children, examinations module and current guardian link.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: studentId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Published report cards }, '404': { description: Child not linked }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /exams/children/{studentId}/results/{examId}:
    get:
      operationId: getChildResult
      summary: Read a linked child's published report card
      description: Requires exams:read_children and current guardian link.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: studentId, in: path, required: true, schema: { type: string, format: uuid } }, { name: examId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Report card }, '404': { description: Child or result unavailable }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /exams/{id}:
    get:
      operationId: getExam
      summary: Inspect an exam and its subject definitions
      description: Requires exams:read and examinations module.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Exam detail }, '404': { description: Exam missing }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
    patch:
      operationId: updateExam
      summary: Update a draft exam
      description: Requires exams:manage and administrator role. Academic context is immutable after creation.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExamInput' } } } }
      responses: { '200': { description: Draft updated }, '409': { description: Published or locked }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
    delete:
      operationId: deleteExam
      summary: Delete a draft exam
      description: Requires exams:manage and administrator role.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Draft deleted }, '409': { description: Published or locked }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /exams/{id}/subjects:
    post:
      operationId: saveExamSubject
      summary: Add or update mapped subject full and pass marks
      description: Requires exams:manage and administrator role; only draft exams can change.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExamSubjectInput' } } } }
      responses: { '200': { description: Subject saved }, '400': { description: Invalid subject or marks }, '409': { description: More than one fourth subject }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /exams/{id}/subjects/{subjectId}:
    delete:
      operationId: deleteExamSubject
      summary: Remove a subject and its draft marks
      description: Requires exams:manage and administrator role.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: subjectId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Subject removed }, '409': { description: Published or locked }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /exams/{id}/roster:
    get:
      operationId: getExamMarksRoster
      summary: Inspect students and marks for every exam subject
      description: Requires exams:read and examinations module.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Marks roster }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /exams/{id}/assigned-roster:
    get:
      operationId: getAssignedMarksRoster
      summary: Inspect only subjects assigned to the signed-in teacher
      description: Requires exams:enter_marks and current teacher assignment.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Assigned marks roster }, '403': { description: No assignment }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /exams/{id}/marks:
    put:
      operationId: saveExamMarks
      summary: Enter or correct up to 500 marks atomically
      description: Requires exams:enter_marks and examinations module. Teachers are restricted to current subject assignments; administrators may correct all draft marks. Each change is audited.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExamMarksInput' } } } }
      responses: { '200': { description: Marks saved }, '400': { description: Invalid or duplicate entries }, '403': { description: Subject not assigned }, '409': { description: Exam is published or locked (exam_not_draft), or the sheet was submitted or approved (sheet_state) }, '401': { $ref: '#/components/responses/Unauthorized' } }
    patch:
      operationId: saveExamMarkCells
      summary: Save marks and mark statuses cell by cell, with version checks
      description: >-
        Requires exams:enter_marks and the examinations module. Each entry is a cell
        (exam_subject_id, student_id) with a status (present, absent, incomplete; exempt
        and withheld for administrators only, with a reason) and marks for present
        (withheld may keep marks). row_version is the version the client last saw (0 for an
        empty cell); a stale version is reported as version_conflict with the current value
        and never overwrites. Invalid cells are reported in errors and the valid ones are
        saved. Teachers write only assigned subjects; sheets that are submitted or approved
        are read-only until returned. Up to 500 cells; every change is audited.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [entries], properties: { entries: { type: array, maxItems: 500, items: { type: object, required: [exam_subject_id, student_id, status, row_version], properties: { exam_subject_id: { type: string, format: uuid }, student_id: { type: string, format: uuid }, status: { type: string, enum: [present, absent, exempt, incomplete, withheld] }, marks: { type: number, nullable: true }, reason: { type: string, maxLength: 240 }, row_version: { type: integer, minimum: 0 } } } } } } } } }
      responses: { '200': { description: 'saved (cells with their new row_version) and errors (cells not saved, with a code such as above_full_marks, sheet_locked, not_assigned, reason_required or version_conflict)' }, '400': { description: Malformed or duplicate entries }, '403': { description: Not a teacher or administrator }, '409': { description: exam_not_draft }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /exams/{id}/sheets:
    get:
      operationId: getExamSheets
      summary: Mark sheets of an exam with progress, review state and publication readiness
      description: Requires exams:read. One sheet per exam subject with its status (not_started, in_progress, submitted, returned, approved), counts of entered, missing, absent, exempt, incomplete and withheld marks, and the blockers that stop publication.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Sheets and readiness }, '404': { description: Exam not found }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /exams/assigned/{id}/sheets:
    get:
      operationId: getAssignedExamSheets
      summary: A teacher's own mark sheets of an exam
      description: Requires exams:enter_marks and the teacher role; only sheets of assigned subjects are returned.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Sheets and readiness }, '403': { description: No assigned subject in this exam }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /exams/terms:
    get:
      operationId: listExamTerms
      summary: The exam terms of a session, in order
      description: Requires exams:read. Each term has its order (sequence), kind (term or annual), optional dates, status (planning, running, results, closed), the number of exams linked to it, whether the upgrade made it from existing exams (legacy) and the setup wizard's saved choices.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: session_id, in: query, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Terms }, '400': { description: Invalid input }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      operationId: createExamTerm
      summary: Add a term to a session (after its last term)
      description: Requires exams:manage and an administrator. Body session_id, name (≤120, unique in the session), kind (term or annual), optional starts_on and ends_on (YYYY-MM-DD). Audited as exam.term_saved.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [session_id, name, kind], properties: { session_id: { type: string, format: uuid }, name: { type: string, maxLength: 120 }, kind: { type: string, enum: [term, annual] }, starts_on: { type: string }, ends_on: { type: string } } } } } }
      responses: { '201': { description: Created term }, '400': { description: Invalid input }, '409': { description: A term with that name already exists }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /exams/terms/{id}:
    put:
      operationId: updateExamTerm
      summary: Rename a term or change its dates (or its kind while it has no exams)
      description: Requires exams:manage and an administrator. Same body as creation; session_id is ignored. 409 in_use when the kind changes on a term with exams.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, properties: { session_id: { type: string }, name: { type: string, maxLength: 120 }, kind: { type: string, enum: [term, annual] }, starts_on: { type: string }, ends_on: { type: string } } } } } }
      responses: { '200': { description: Updated term }, '400': { description: Invalid input }, '404': { description: Term not found }, '409': { description: In use or name taken }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
    delete:
      operationId: deleteExamTerm
      summary: Delete an unused term
      description: Requires exams:manage and an administrator. 409 in_use when exams or blueprint assessments use the term, or the upgrade made it.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: Deleted }, '404': { description: Term not found }, '409': { description: In use }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /exams/terms/{id}/setup:
    get:
      operationId: getTermSetup
      summary: The exam setup wizard's plan for a term
      description: Requires exams:read. Every active class with its blueprint state for the term (ready, needs_blueprint, no_assessments), the chosen classes, the assessments across them with marks due dates, sheet counts (all, new), exams that already exist, existing exams whose names the new ones would take (conflicts), subjects without a teacher (gaps) and the teachers who can take them.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Setup plan }, '404': { description: Term not found }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
    put:
      operationId: saveTermSetup
      summary: Keep the wizard's choices on the term
      description: Requires exams:manage and an administrator. Body class_ids, due (assessment key → YYYY-MM-DD) and assignees ("classId|subjectId" → teacher employee id). Nothing reaches teachers until the term is created.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, properties: { class_ids: { type: array, items: { type: string, format: uuid } }, due: { type: object, additionalProperties: { type: string } }, assignees: { type: object, additionalProperties: { type: string } } } } } } }
      responses: { '200': { description: Setup plan }, '400': { description: Invalid input }, '404': { description: Term not found }, '409': { description: The term is closed }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /exams/terms/{id}/create:
    post:
      operationId: createTermExams
      summary: Create the term's exams and sheets
      description: Requires exams:manage and an administrator. In one transaction, one draft exam per section per assessment of the term for every chosen ready class (linked by term, assessment and blueprint version, with the marks due date) and one sheet per subject with its components; chosen teachers are assigned to subjects nobody teaches; the term moves to running. Exams that already exist are left alone, so running it again creates nothing new. 409 setup_blocked without a ready class, with an assessment lacking a due date, or with a name conflict. Audited as exam.term_created.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Counts and the new plan }, '404': { description: Term not found }, '409': { description: Setup blocked }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /exams/blueprints:
    get:
      operationId: listClassBlueprints
      summary: Every class of a session with its assessment blueprint, if any
      description: Requires exams:read. For each class, the blueprint's active version, open draft and version history; classes without a blueprint have blueprint_id null.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: session_id, in: query, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Classes and blueprints }, '400': { description: Invalid input }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      operationId: createBlueprintDraft
      summary: Open a blueprint draft for a class
      description: Requires exams:manage and an administrator. Without copy_from the draft starts from today's model (one term exam per term, every class subject out of 100, pass 33, final only). With copy_from it copies that version; from another session its terms are mapped by order, and missing terms are created in planning. 409 when the class already has an open draft. Audited as exam.blueprint_drafted.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [session_id, class_id], properties: { session_id: { type: string, format: uuid }, class_id: { type: string, format: uuid }, copy_from: { type: string, format: uuid } } } } } }
      responses: { '201': { description: Draft version, as returned by getBlueprintVersion }, '400': { description: Invalid input }, '404': { description: Class or version not found }, '409': { description: A draft is already open }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /exams/blueprints/{id}/versions:
    post:
      operationId: createBlueprintVersion
      summary: Open the next version of a blueprint from one of its versions
      description: Requires exams:manage and an administrator. Exams keep the version they were created from; new exams use the newly activated one. 409 when a draft is already open.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [from_version_id], properties: { from_version_id: { type: string, format: uuid } } } } } }
      responses: { '201': { description: Draft version }, '400': { description: Invalid input }, '404': { description: Version not found }, '409': { description: A draft is already open }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /exams/blueprint-versions/{id}:
    get:
      operationId: getBlueprintVersion
      summary: One blueprint version with its definition, context and issues
      description: Requires exams:read. The definition (assessments, subjects with sheets, components and term rules, paper rule, annual method, policy), the session's terms, the class's subjects, the school's grading bands, the current validation issues of a draft (code, path, params, message) and the version history. A legacy version's definition is rebuilt from its rows.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Version }, '404': { description: Version not found }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
    put:
      operationId: saveBlueprintDraft
      summary: Save a draft's definition
      description: Requires exams:manage and an administrator. Saving is allowed with issues; the response lists them. 409 in_use for an activated version (it is frozen).
      tags: [exams]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [definition], properties: { definition: { type: object } } } } } }
      responses: { '200': { description: Draft with issues }, '400': { description: Invalid input }, '404': { description: Version not found }, '409': { description: Not a draft }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
    delete:
      operationId: deleteBlueprintDraft
      summary: Discard a draft
      description: Requires exams:manage and an administrator. Only drafts; a blueprint left without versions is removed too.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: Deleted }, '404': { description: Version not found }, '409': { description: Not a draft }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /exams/blueprint-versions/{id}/activate:
    post:
      operationId: activateBlueprintVersion
      summary: Validate and activate a draft
      description: Requires exams:manage and an administrator. Refused with 422 blueprint_invalid and the list of issues when any activation rule fails. Activation writes the normalised assessments, subjects and components, snapshots the grading bands, records the definition's SHA-256, freezes the version and retires the previous active version (its exams keep it). Audited as exam.blueprint_activated.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Active version }, '404': { description: Version not found }, '409': { description: Not a draft }, '422': { description: Issues to fix }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /exams/blueprint-versions/{id}/visibility:
    put:
      operationId: setAssessmentVisibility
      summary: Choose whether students see an assessment's own results
      description: Requires exams:manage and an administrator. visibility is hidden, after_term_publication or with_assessment_publication. A display policy, so it may change on an active version; audited as exam.assessment_visibility_changed.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [key, visibility], properties: { key: { type: string }, visibility: { type: string, enum: [hidden, after_term_publication, with_assessment_publication] } } } } } }
      responses: { '200': { description: Version }, '400': { description: Invalid input }, '404': { description: Version or assessment not found }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /exams/blueprint-versions/{id}/sample:
    post:
      operationId: sampleBlueprintSubject
      summary: Work one subject's term mark from sample marks
      description: Requires exams:read. Body subject_id, term_id, marks by assessment key (status, marks or component marks) and, for a draft, the unsaved definition. Returns the subject line with each contribution's exact value, the term mark, grade, point and any reason it fails. Nothing is stored.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, properties: { subject_id: { type: string }, term_id: { type: string }, definition: { type: object }, marks: { type: object } } } } } }
      responses: { '200': { description: Worked subject line }, '400': { description: Invalid input }, '404': { description: Version not found }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /exams/subject-choices:
    get:
      operationId: listSubjectChoices
      summary: A class's fourth subjects and each student's optional subject
      description: Requires exams:read. While no student of the class has a choice, the class's fourth subject applies to everyone, as before; once any student has one, choices decide and a student without one takes no optional subject.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: session_id, in: query, required: true, schema: { type: string, format: uuid } }, { name: class_id, in: query, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Choices }, '400': { description: Invalid input }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
    put:
      operationId: saveSubjectChoices
      summary: Set or clear students' optional subjects
      description: Requires exams:manage and an administrator. Each choice names a student of the class and session and a fourth subject of the class, or an empty subject_id to clear it; at most 500. Published results do not change. Audited as exam.subject_choices_saved.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [session_id, class_id, choices], properties: { session_id: { type: string, format: uuid }, class_id: { type: string, format: uuid }, choices: { type: array, maxItems: 500, items: { type: object, additionalProperties: false, properties: { student_id: { type: string, format: uuid }, subject_id: { type: string } } } } } } } } }
      responses: { '200': { description: Choices }, '400': { description: Invalid input }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /exams/my-sheets:
    get:
      operationId: getMyExamSheets
      summary: A teacher's mark sheets across exams (work queue)
      description: Requires exams:enter_marks and the teacher role. Sheets of assigned subjects in draft exams of any session and in published or locked exams of the active session, with progress (students, entered, missing), status and return reason; work that needs the teacher first. At most 300.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Sheets }, '403': { description: Not a teacher }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /exams/{id}/sheets/{sheetId}:
    get:
      operationId: getExamSheetWorkspace
      summary: One mark sheet with its rows and what the caller may do
      description: Requires exams:read. Returns the exam, the sheet with progress, one row per active student (marks, status, reason, row_version) and permissions (can_edit, can_submit, can_review, statuses, read_only_reason exam_published, exam_locked, sheet_submitted, sheet_approved or review_only) that mirror the write routes.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: sheetId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Sheet workspace }, '404': { description: Exam or sheet not found }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /exams/assigned/{id}/sheets/{sheetId}:
    get:
      operationId: getAssignedExamSheetWorkspace
      summary: One of the teacher's own mark sheets with its rows and permissions
      description: Requires exams:enter_marks and the teacher role; 403 unless the teacher is assigned to the subject.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: sheetId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Sheet workspace }, '403': { description: Not assigned }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /exams/{id}/sheets/{sheetId}/history:
    get:
      operationId: getExamSheetHistory
      summary: Audited changes of a mark sheet, newest first
      description: Requires exams:read. Mark changes (old and new marks and status) and sheet submissions, returns and approvals from the audit log, with the actor and student; at most 200.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: sheetId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: History }, '404': { description: Exam or sheet not found }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /exams/assigned/{id}/sheets/{sheetId}/history:
    get:
      operationId: getAssignedExamSheetHistory
      summary: Audited changes of one of the teacher's own mark sheets
      description: Requires exams:enter_marks and the teacher role; 403 unless the teacher is assigned to the subject.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: sheetId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: History }, '403': { description: Not assigned }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /exams/{id}/sheets/{sheetId}/submit:
    post:
      operationId: submitExamSheet
      summary: Submit a mark sheet for review
      description: Requires exams:enter_marks; the assigned teacher or an administrator. Every active student must have marks or a status. The sheet becomes read-only for the teacher. Audited.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: sheetId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: The submitted sheet }, '403': { description: Not assigned }, '404': { description: Sheet not found }, '409': { description: 'exam_not_draft, sheet_state or sheet_incomplete' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /exams/{id}/sheets/{sheetId}/approve:
    post:
      operationId: approveExamSheet
      summary: Approve a submitted mark sheet
      description: Requires exams:review and the head teacher or administrator role. Audited.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: sheetId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: The approved sheet }, '404': { description: Sheet not found }, '409': { description: 'exam_not_draft, sheet_state or sheet_incomplete' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /exams/{id}/sheets/{sheetId}/return:
    post:
      operationId: returnExamSheet
      summary: Return a submitted or approved sheet to the teacher with a reason
      description: Requires exams:review and the head teacher or administrator role. The reason (1–240 characters) is shown to the teacher. Audited.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: sheetId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 1, maxLength: 240 } } } } } }
      responses: { '200': { description: The returned sheet }, '400': { description: Reason missing or too long }, '404': { description: Sheet not found }, '409': { description: 'exam_not_draft or sheet_state' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /exams/{id}/state:
    patch:
      operationId: setExamState
      summary: Publish, unpublish, or lock exam results
      description: Requires exams:manage and administrator role. Publication requires marks or a status for every active eligible student, no incomplete mark (exam_marks_incomplete) and no sheet awaiting review or returned (exam_sheets_pending); it uses the current school grading scheme, approves every sheet, scores absent as 0 (fail), leaves exempt subjects out and holds withheld results back. Unpublishing reopens the sheets. Locked results cannot be changed.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [draft, published, locked] } } } } } }
      responses: { '200': { description: Exam state changed }, '409': { description: Incomplete marks or locked exam }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /exams/{id}/tabulation:
    get:
      operationId: getExamTabulation
      summary: Class and section merit positions and GPA tabulation
      description: Requires exams:read and examinations module.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Tabulation sheet }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /exams/{id}/results/{studentId}:
    get:
      operationId: getExamStudentResult
      summary: Inspect a student's calculated report card
      description: Requires exams:read and examinations module.
      tags: [exams]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: studentId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Report card }, '404': { description: Result unavailable }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /fees/options:
    get:
      operationId: getFeeOptions
      summary: List sessions, classes, active sections and active fee categories for fee screens
      description: Requires fees:read and the fees module, so accountants need no academic grants.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Lookup lists }, '403': { description: Permission or module denied }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /fees/students:
    get:
      operationId: searchFeeStudents
      summary: Search students by admission number or name for fee collection
      description: Requires fees:read and the fees module. Returns minimal identity and class context only.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Search' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/FeeSession' }, { $ref: '#/components/parameters/FeeClass' }, { name: section_id, in: query, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Paginated students }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /fees/students/{id}/statement:
    get:
      operationId: getStudentFeeStatement
      summary: Read a student's dues, payments and totals including arrears
      description: Requires fees:read and the fees module.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/FeeId' }]
      responses: { '200': { description: Fee statement, content: { application/json: { schema: { $ref: '#/components/schemas/FeeStatement' } } } }, '404': { description: Unknown student }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /fees/categories:
    get:
      operationId: listFeeCategories
      summary: List fee categories
      description: Requires fees:read and the fees module.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Search' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses: { '200': { description: Paginated categories }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      operationId: createFeeCategory
      summary: Create a monthly or one-time fee category
      description: Requires fees:manage, admin or accountant role, and the fees module. Codes are unique upper-case identifiers.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FeeCategoryInput' } } } }
      responses: { '201': { description: Category created }, '400': { description: Invalid input }, '409': { description: Duplicate code }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /fees/categories/{id}:
    patch:
      operationId: updateFeeCategory
      summary: Rename or deactivate a fee category
      description: Requires fees:manage and admin or accountant role. Code and frequency are fixed once a structure uses the category.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/FeeId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FeeCategoryInput' } } } }
      responses: { '200': { description: Category updated }, '409': { description: Code or frequency in use }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /fees/structures:
    get:
      operationId: listFeeStructures
      summary: List configured fee amounts by session, class and category
      description: Requires fees:read and the fees module.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/FeeSession' }, { $ref: '#/components/parameters/FeeClass' }, { name: category_id, in: query, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses: { '200': { description: Paginated structures }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      operationId: createFeeStructure
      summary: Configure a fee amount and due day for a session and class
      description: Requires fees:manage and admin or accountant role. One structure per session, class and category.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FeeStructureInput' } } } }
      responses: { '201': { description: Structure created }, '400': { description: Invalid context or inactive category }, '409': { description: Duplicate structure }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /fees/structures/{id}:
    patch:
      operationId: updateFeeStructure
      summary: Change a structure amount, due day or active state
      description: Requires fees:manage and admin or accountant role. Session, class and category are fixed; existing dues keep their snapshot amount.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/FeeId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FeeStructureInput' } } } }
      responses: { '200': { description: Structure updated }, '409': { description: Context change rejected }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /fees/concessions:
    get:
      operationId: listFeeConcessions
      summary: List standing student concessions
      description: Requires fees:read and the fees module.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: student_id, in: query, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/Search' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses: { '200': { description: Paginated concessions }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      operationId: saveFeeConcession
      summary: Create or replace a student's percentage concession for one category
      description: Requires fees:manage and admin or accountant role. Applies to dues created afterwards and is recorded as a discount adjustment.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FeeConcessionInput' } } } }
      responses: { '200': { description: Concession saved }, '400': { description: Invalid input }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /fees/concessions/{id}:
    delete:
      operationId: deleteFeeConcession
      summary: Remove a standing concession
      description: Requires fees:manage and admin or accountant role. Existing dues are unchanged.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/FeeId' }]
      responses: { '200': { description: Deleted }, '404': { description: Unknown concession }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /fees/dues:
    get:
      operationId: listStudentDues
      summary: List student dues with balance, status and overdue flag
      description: Requires fees:read and the fees module. Status overdue means an unpaid balance past its due date (arrears).
      tags: [fees]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/FeeSession' }, { $ref: '#/components/parameters/FeeClass' }, { name: section_id, in: query, schema: { type: string, format: uuid } }, { name: student_id, in: query, schema: { type: string, format: uuid } }, { name: category_id, in: query, schema: { type: string, format: uuid } }, { name: period, in: query, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }, { name: status, in: query, schema: { type: string, enum: [unpaid, partial, paid, waived, outstanding, overdue] } }, { $ref: '#/components/parameters/Search' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses: { '200': { description: Paginated dues }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      operationId: assignStudentDue
      summary: Assign one fee structure to one student
      description: Requires fees:manage and admin or accountant role. The structure must match the student's session and class; monthly fees need a period inside the session.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FeeDueInput' } } } }
      responses: { '201': { description: Due created }, '400': { description: Invalid context or period }, '409': { description: Already assigned or inactive structure }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /fees/dues/generate:
    post:
      operationId: generateMonthlyDues
      summary: Generate dues for every active student in a session or class for one month
      description: Requires fees:manage and admin or accountant role. Rerunning skips dues that already exist.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FeeGenerateInput' } } } }
      responses: { '200': { description: Created and skipped counts }, '400': { description: Period outside session }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /fees/dues/{id}:
    delete:
      operationId: deleteStudentDue
      summary: Delete a mistaken due that has no payments
      description: Requires fees:manage and admin or accountant role.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/FeeId' }]
      responses: { '200': { description: Deleted }, '409': { description: Payments exist }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /fees/dues/{id}/adjustments:
    get:
      operationId: listDueAdjustments
      summary: List discounts and waivers applied to a due
      description: Requires fees:read and the fees module.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/FeeId' }]
      responses: { '200': { description: Adjustments }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      operationId: adjustStudentDue
      summary: Apply a discount or waive the remaining balance
      description: Requires fees:manage and admin or accountant role. Waivers are administrator-only and write off exactly the remaining balance; discounts cannot exceed it.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/FeeId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FeeAdjustmentInput' } } } }
      responses: { '200': { description: Updated due }, '403': { description: Waiver by non-administrator }, '409': { description: Exceeds balance or already settled }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /fees/payments:
    get:
      operationId: listFeePayments
      summary: List receipts by date range, method, class or search
      description: Requires fees:read and the fees module.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/FeeFrom' }, { $ref: '#/components/parameters/FeeTo' }, { $ref: '#/components/parameters/FeeMethod' }, { $ref: '#/components/parameters/FeeClass' }, { name: student_id, in: query, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/Search' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses: { '200': { description: Paginated payments }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      operationId: recordFeePayment
      summary: Record a full or partial payment and issue a receipt
      description: Requires fees:collect and admin or accountant role. The amount settles the oldest selected dues first and cannot exceed their balance. Reusing idempotency_key returns the original receipt with 200; bank, bKash and Nagad references must be unique.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FeePaymentInput' } } } }
      responses: { '201': { description: Receipt issued, content: { application/json: { schema: { $ref: '#/components/schemas/FeeReceipt' } } } }, '200': { description: Idempotent replay of the original receipt }, '409': { description: overpayment or duplicate_payment }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /fees/payments/{id}:
    get:
      operationId: getFeeReceipt
      summary: Read a printable receipt
      description: Requires fees:read and the fees module.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/FeeId' }]
      responses: { '200': { description: Receipt, content: { application/json: { schema: { $ref: '#/components/schemas/FeeReceipt' } } } }, '404': { description: Unknown receipt }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /fees/reports/collections:
    get:
      operationId: getFeeCollectionReport
      summary: Fee collections by method, class, category and day
      description: Requires fees:read and the fees module. Defaults to the current month; ranges are limited to about two years.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/FeeFrom' }, { $ref: '#/components/parameters/FeeTo' }, { $ref: '#/components/parameters/FeeSession' }, { $ref: '#/components/parameters/FeeClass' }, { $ref: '#/components/parameters/FeeMethod' }]
      responses: { '200': { description: Collection report }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /fees/reports/dues:
    get:
      operationId: getFeeDueReport
      summary: Per-student outstanding balances and arrears
      description: Requires fees:read and the fees module. Sorted by arrears, then balance.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/FeeSession' }, { $ref: '#/components/parameters/FeeClass' }, { name: section_id, in: query, schema: { type: string, format: uuid } }, { name: overdue_only, in: query, schema: { type: boolean } }, { $ref: '#/components/parameters/Search' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses: { '200': { description: Paginated due report with totals }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /fees/me:
    get:
      operationId: getOwnFeeStatement
      summary: Read the signed-in student's fee statement
      description: Requires fees:read_self, student role and the fees module.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Fee statement, content: { application/json: { schema: { $ref: '#/components/schemas/FeeStatement' } } } }, '404': { description: No linked student }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /fees/me/payments/{id}:
    get:
      operationId: getOwnFeeReceipt
      summary: Read one of the signed-in student's receipts
      description: Requires fees:read_self and student role. Other students' receipts read as not found.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/FeeId' }]
      responses: { '200': { description: Receipt }, '404': { description: Not found or not owned }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /fees/children/{studentId}:
    get:
      operationId: getChildFeeStatement
      summary: Read a linked child's fee statement
      description: Requires fees:read_children, guardian role and a current guardian link.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: studentId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Fee statement }, '404': { description: Not linked }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /fees/children/{studentId}/payments/{id}:
    get:
      operationId: getChildFeeReceipt
      summary: Read one receipt for a linked child
      description: Requires fees:read_children, guardian role and a current guardian link.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: studentId, in: path, required: true, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/FeeId' }]
      responses: { '200': { description: Receipt }, '404': { description: Not linked or not owned }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /fees/online/status:
    get:
      operationId: getOnlinePaymentStatus
      summary: Whether online payment is available, and how
      description: Requires auth:read_self and the fees module. Mode is off unless the deployment sets PAYMENT_SIMULATION_ALLOWED=true and an administrator enables simulation; then it is simulation. There is no live bKash or Nagad integration. simulation_allowed and simulation_enabled are reported to administrators only.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: 'mode (off or simulation), simulation_allowed, simulation_enabled, updated_at' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /fees/online/settings:
    put:
      operationId: saveOnlinePaymentSettings
      summary: Switch payment simulation on or off
      description: Requires fees:manage and the admin role; audited. Switching simulation on is refused with simulation_not_allowed unless the deployment allows it. Switching it off always works and blocks checkouts already started.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [simulation_enabled], properties: { simulation_enabled: { type: boolean } } } } } }
      responses: { '200': { description: Online payment status }, '409': { description: simulation_not_allowed }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /fees/online/intents:
    post:
      operationId: startSimulatedMobilePayment
      summary: Start a simulated bKash or Nagad checkout for a linked child's dues
      description: Requires fees:pay_online (guardians by default; students no longer hold it) and simulation mode, otherwise 403 online_payments_disabled. Simulated references start with SIM and are never provider transaction IDs. The session expires after 15 minutes.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FeeIntentInput' } } } }
      responses: { '201': { description: Pending simulated checkout }, '404': { description: Not linked }, '409': { description: Amount exceeds outstanding balance }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { description: Forbidden or online_payments_disabled } }
  /fees/online/intents/{id}/confirm:
    post:
      operationId: confirmSimulatedMobilePayment
      summary: Complete a simulated checkout (no money moves, nothing is recorded)
      description: Requires fees:pay_online, the same payer and simulation mode, otherwise 403 online_payments_disabled. The simulator accepts only code 123456. Success records no payment, receipt or ledger income and changes no balance; the response says SIMULATED — NO MONEY TRANSFERRED. Repeated confirmation returns the same simulation.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/FeeId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [otp], properties: { otp: { type: string, maxLength: 12 } } } } } }
      responses: { '200': { description: 'Simulation result: simulated, intent, unchanged balance, message, replayed' }, '409': { description: payment_expired or fee_conflict }, '422': { description: payment_declined }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { description: Forbidden or online_payments_disabled } }
  /fees/payments/{id}/void:
    post:
      operationId: voidSimulatedFeePayment
      summary: Void a simulated payment recorded before the payment-safety upgrade
      description: Requires fees:manage and the admin role; audited. Only simulated payments can be voided. The dues the payment reduced are owed again; the payment, its allocations and ledger line stay in the history, marked void. A reason is required.
      tags: [fees]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/FeeId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, maxLength: 240 } } } } } }
      responses: { '200': { description: The voided payment }, '403': { description: Not a simulated payment, or not an administrator }, '409': { description: Already voided }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /accounts/entries:
    get:
      operationId: listLedgerEntries
      summary: List income and expense ledger entries
      description: Requires accounts:read and the fees module. Fee receipts appear as income in category fees.
      tags: [accounts]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: type, in: query, schema: { type: string, enum: [income, expense] } }, { name: category, in: query, schema: { type: string } }, { $ref: '#/components/parameters/FeeFrom' }, { $ref: '#/components/parameters/FeeTo' }, { $ref: '#/components/parameters/Search' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses: { '200': { description: Paginated entries }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      operationId: createLedgerEntry
      summary: Record a manual income or expense
      description: Requires accounts:manage and admin or accountant role. Category fees is reserved for receipts; dates cannot be in the future.
      tags: [accounts]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LedgerEntryInput' } } } }
      responses: { '201': { description: Entry recorded }, '400': { description: Invalid category, amount or date }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /accounts/entries/{id}:
    delete:
      operationId: deleteLedgerEntry
      summary: Remove a manual ledger entry
      description: Requires accounts:manage and admin or accountant role. Fee income linked to a receipt cannot be removed.
      tags: [accounts]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/FeeId' }]
      responses: { '200': { description: Deleted }, '409': { description: Linked to a receipt }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /accounts/summary:
    get:
      operationId: getAccountingSummary
      summary: Income, expense and net by category with outstanding dues and arrears
      description: Requires accounts:read and the fees module. Defaults to the current month.
      tags: [accounts]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/FeeFrom' }, { $ref: '#/components/parameters/FeeTo' }]
      responses: { '200': { description: Accounting summary }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /notices:
    get:
      operationId: listNoticeFeed
      summary: "Live notices addressed to the signed-in user, urgent first"
      description: "Requires notices:read. Requires the notices module. Students and guardians see class/section-targeted notices only for their (linked) class; teachers for classes they teach."
      tags: [notices]
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Paginated feed }, '403': { description: Permission, role or module denied }, '401': { $ref: '#/components/responses/Unauthorized' } }
    post:
      operationId: createNotice
      summary: "Create a draft notice"
      description: "Requires notices:manage and admin or head teacher role. Requires the notices module. Audience roles, optional class/section targets, priority, expiry and up to 10 attachment ids from the author's own uploads."
      tags: [notices]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NoticeInput' } } } }
      responses: { '201': { description: Draft notice }, '400': { description: Invalid input or attachment }, '403': { description: Permission, role or module denied }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /notices/manage:
    get:
      operationId: listManagedNotices
      summary: "All notices with status filter (draft, published, scheduled, expired, archived)"
      description: "Requires notices:manage. Requires the notices module."
      tags: [notices]
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Paginated notices }, '403': { description: Permission, role or module denied }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /notices/files:
    post:
      operationId: uploadNoticeFile
      summary: "Upload a PDF, JPEG or PNG for a notice"
      description: "Requires notices:manage and admin or head teacher role. Type is detected from content; PDFs up to 10 MiB without active content, images up to 5 MiB re-encoded to strip metadata."
      tags: [notices]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } } } } }
      responses: { '201': { description: Upload id }, '413': { description: Too large }, '415': { description: Unsupported type }, '403': { description: Permission, role or module denied }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /notices/{id}:
    get:
      operationId: getNotice
      summary: "Read one notice"
      description: "Requires notices:read. Managers see any notice; others only live notices addressed to them."
      tags: [notices]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Notice }, '404': { description: Not visible }, '403': { description: Permission, role or module denied }, '401': { $ref: '#/components/responses/Unauthorized' } }
    patch:
      operationId: updateNotice
      summary: "Edit a draft or published notice"
      description: "Requires notices:manage and admin or head teacher role. Archived notices cannot change."
      tags: [notices]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NoticeInput' } } } }
      responses: { '200': { description: Notice }, '409': { description: Archived }, '403': { description: Permission, role or module denied }, '401': { $ref: '#/components/responses/Unauthorized' } }
    delete:
      operationId: deleteNotice
      summary: "Delete a draft notice"
      description: "Requires notices:manage and admin or head teacher role."
      tags: [notices]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Deleted }, '409': { description: Not a draft }, '403': { description: Permission, role or module denied }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /notices/{id}/publish:
    post:
      operationId: publishNotice
      summary: "Publish now or schedule a notice"
      description: "Requires notices:manage and admin or head teacher role. Optional RFC 3339 publish_at schedules it; expiry must be later."
      tags: [notices]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { publish_at: { type: string, format: date-time, nullable: true } } } } } }
      responses: { '200': { description: Notice }, '403': { description: Permission, role or module denied }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /notices/{id}/archive:
    post:
      operationId: archiveNotice
      summary: "Archive a notice"
      description: "Requires notices:manage and admin or head teacher role. Unread notifications for it are withdrawn on the next dispatch."
      tags: [notices]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Notice }, '403': { description: Permission, role or module denied }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /notices/{id}/files/{fileId}:
    get:
      operationId: getNoticeFile
      summary: "Download a notice attachment"
      description: "Requires notices:read and visibility of the notice. Served with nosniff, no-store and a sandbox CSP; ?download=1 forces a download."
      tags: [notices]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: fileId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: File }, '404': { description: Not visible }, '403': { description: Permission, role or module denied }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /events:
    get:
      operationId: listEvents
      summary: "Events overlapping from..to (at most 400 days)"
      description: "Requires events:read. Requires the notices module. Others see published and cancelled events addressed to them; managers add manage=1 to include drafts."
      tags: [events]
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Events }, '403': { description: Permission, role or module denied }, '401': { $ref: '#/components/responses/Unauthorized' } }
    post:
      operationId: createEvent
      summary: "Create a draft event"
      description: "Requires events:manage and admin or head teacher role. Kinds holiday, exam, meeting, event, other; all-day or timed; end not before start."
      tags: [events]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EventInput' } } } }
      responses: { '201': { description: Event }, '403': { description: Permission, role or module denied }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /events/{id}:
    patch:
      operationId: updateEvent
      summary: "Edit an event"
      description: "Requires events:manage and admin or head teacher role."
      tags: [events]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EventInput' } } } }
      responses: { '200': { description: Event }, '403': { description: Permission, role or module denied }, '401': { $ref: '#/components/responses/Unauthorized' } }
    delete:
      operationId: deleteEvent
      summary: "Delete a draft event"
