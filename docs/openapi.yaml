      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Search' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/AcademicStatus' }]
      responses: { '200': { description: Subjects, content: { application/json: { schema: { $ref: '#/components/schemas/SubjectPageResponse' } } } }, '400': { $ref: '#/components/responses/InvalidRequest' } }
    post:
      operationId: createAcademicSubject
      tags: [academic]
      summary: Create a subject
