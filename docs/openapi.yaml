      responses: { '201': { description: Assignment, content: { application/json: { schema: { $ref: '#/components/schemas/MappingResponse' } } } }, '400': { $ref: '#/components/responses/InvalidRequest' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/AcademicConflict' } }
  /academic/classes/{id}/subjects/{subjectId}:
    parameters: [{ $ref: '#/components/parameters/AcademicId' }, { name: subjectId, in: path, required: true, schema: { type: string, format: uuid } }]
    patch:
      operationId: updateClassSubject
      tags: [academic]
      summary: Change required or fourth-subject designation
      description: Requires academics:manage, an administrator account, and the academics module. Exactly one flag must be true.
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MappingFlags' } } } }
      responses: { '200': { description: Assignment, content: { application/json: { schema: { $ref: '#/components/schemas/MappingResponse' } } } }, '400': { $ref: '#/components/responses/InvalidRequest' }, '404': { $ref: '#/components/responses/NotFound' } }
    delete:
      operationId: removeClassSubject
      tags: [academic]
      summary: Remove a subject from a class
      description: Requires academics:manage, an administrator account, and the academics module.
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Assignment removed }, '404': { $ref: '#/components/responses/NotFound' } }
  /staff/employees:
    get:
      operationId: listEmployees
      tags: [staff]
      summary: Search and paginate employee profiles
      description: Requires staff:read and the enabled staff module. Optional search, kind, status, page, and page_size filters.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Search' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses: { '200': { description: Employee page }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      operationId: createEmployee
      tags: [staff]
      summary: Create an employee profile
      description: Requires staff:manage, an administrator account, and the enabled staff module. A linked user must have a compatible active role.
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EmployeeInput' } } } }
      responses: { '201': { description: Created employee }, '400': { $ref: '#/components/responses/InvalidRequest' }, '409': { description: Duplicate employee code or user association } }
  /staff/employees/{id}:
    parameters: [{ $ref: '#/components/parameters/AcademicId' }]
    get:
      operationId: getEmployee
      tags: [staff]
      summary: Read an employee profile
      description: Requires staff:read and the staff module.
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Employee profile }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      operationId: updateEmployee
      tags: [staff]
      summary: Update an employee profile
      description: Requires staff:manage, an administrator account, and the staff module. Supply all editable fields.
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EmployeeInput' } } } }
      responses: { '200': { description: Updated employee }, '409': { description: Duplicate or incompatible record } }
  /staff/me:
    get:
      operationId: getOwnEmployee
      tags: [staff]
      summary: Read the signed-in employee profile
      description: Requires staff:read_self and the staff module. Resolves the profile by authenticated user ID.
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Own employee profile }, '404': { $ref: '#/components/responses/NotFound' } }
  /staff/me/assignments:
    get:
      operationId: getOwnAssignments
      tags: [staff]
      summary: Read own teaching assignments
      description: Requires staff:read_self and the staff module.
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Own assignments } }
  /staff/me/leaves:
    get:
      operationId: getOwnLeaves
      tags: [staff]
      summary: Read own leave requests
      description: Requires staff_leaves:request_self and the staff module.
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Own leave history } }
    post:
      operationId: requestOwnLeave
      tags: [staff]
      summary: Request own leave
      description: Requires staff_leaves:request_self and the staff module.
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LeaveInput' } } } }
      responses: { '201': { description: Pending leave request }, '400': { $ref: '#/components/responses/InvalidRequest' } }
  /staff/employees/{id}/assignments:
    parameters: [{ $ref: '#/components/parameters/AcademicId' }]
    get:
      operationId: listTeacherAssignments
      tags: [staff]
      summary: Read an employee's teaching assignments
      description: Requires staff:read and the staff module.
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Teacher assignments } }
    post:
      operationId: addTeacherAssignment
      tags: [staff]
      summary: Assign a teacher to a session, class, and subject
      description: Requires staff:manage, an administrator account, and the staff module. The class-subject pair must exist.
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AssignmentInput' } } } }
      responses: { '201': { description: Created assignment }, '409': { description: Duplicate or incompatible assignment } }
  /staff/employees/{id}/assignments/{assignmentId}:
    parameters: [{ $ref: '#/components/parameters/AcademicId' }, { name: assignmentId, in: path, required: true, schema: { type: string, format: uuid } }]
    delete:
      operationId: deleteTeacherAssignment
      tags: [staff]
      summary: Remove a teacher assignment
      description: Requires staff:manage, an administrator account, and the staff module.
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Assignment removed }, '404': { $ref: '#/components/responses/NotFound' } }
  /staff/employees/{id}/leaves:
    parameters: [{ $ref: '#/components/parameters/AcademicId' }]
    get:
      operationId: listEmployeeLeaves
      tags: [staff]
      summary: Read employee leave history
      description: Requires staff_leaves:read and the staff module.
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Leave history } }
    post:
      operationId: requestEmployeeLeave
      tags: [staff]
      summary: Request leave for an employee
      description: Requires staff_leaves:manage, an administrator account, and the staff module.
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LeaveInput' } } } }
      responses: { '201': { description: Pending leave request } }
  /staff/leaves/{id}/decision:
    parameters: [{ $ref: '#/components/parameters/AcademicId' }]
    patch:
      operationId: decideEmployeeLeave
      tags: [staff]
      summary: Approve or reject a pending leave
      description: Requires staff_leaves:manage, an administrator account, and the staff module.
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [approved, rejected] } } } } } }
      responses: { '200': { description: Leave decision }, '409': { description: Leave is not pending } }
  /staff/employees/{id}/salaries:
    parameters: [{ $ref: '#/components/parameters/AcademicId' }]
    get:
      operationId: listEmployeeSalaries
      tags: [staff]
      summary: Read private salary history
      description: Requires staff_salary:read, an administrator account, and the staff module.
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Salary records } }
    post:
      operationId: addEmployeeSalary
      tags: [staff]
      summary: Add a private salary record
      description: Requires staff_salary:manage, an administrator account, and the staff module. Amounts are nonnegative BDT with at most two decimal places.
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SalaryInput' } } } }
      responses: { '201': { description: Salary record }, '409': { description: Record for this effective date already exists } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Search: { name: search, in: query, schema: { type: string, maxLength: 100 }, description: Case-insensitive ID or label search }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
    RoleId: { name: id, in: path, required: true, schema: { type: string }, description: One of the six role identifiers }
    UserId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    AcademicId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    AcademicStatus: { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
  responses:
    AcademicConflict: { description: Duplicate class, subject code, assignment, or inactive assignment target }
    IDList:
      description: Current identifiers
      content:
        application/json:
          schema: { $ref: '#/components/schemas/IDListResponse' }
    NotFound:
      description: Requested resource does not exist
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    LastAdmin:
      description: Change would remove the last authorized administrator
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InvalidRequest:
      description: Invalid JSON or request data
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InvalidCredentials:
      description: Generic incorrect credentials response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InvalidSession:
      description: Session is missing, expired, or revoked
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Access token is missing or invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Permission denied
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UnsupportedMediaType:
      description: Login requires application/json
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    AuthUnavailable:
      description: Authentication requires a configured database
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    EmployeeInput:
      type: object
      required: [employee_code, kind, name_en, designation, joined_on]
      properties:
        employee_code: { type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{1,31}$' }
        user_id: { type: string, format: uuid, nullable: true }
        kind: { type: string, enum: [teacher, non_teaching] }
        name_en: { type: string, maxLength: 160 }
        name_bn: { type: string, maxLength: 160 }
        designation: { type: string, maxLength: 120 }
        phone: { type: string, maxLength: 32 }
        joined_on: { type: string, format: date }
        left_on: { type: string, format: date, nullable: true }
        is_active: { type: boolean }
    AssignmentInput:
      type: object
      required: [session_id, class_id, subject_id]
      properties:
        session_id: { type: string, format: uuid }
        class_id: { type: string, format: uuid }
        subject_id: { type: string, format: uuid }
    LeaveInput:
      type: object
      required: [starts_on, ends_on, leave_type]
      properties:
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date }
        leave_type: { type: string, enum: [casual, sick, annual, other] }
        reason: { type: string, maxLength: 1000 }
    SalaryInput:
      type: object
      required: [effective_on, basic_bdt]
      properties:
        effective_on: { type: string, format: date }
        basic_bdt: { type: string, pattern: '^[0-9]+(\.[0-9]{1,2})?$' }
        allowance_bdt: { type: string, pattern: '^[0-9]+(\.[0-9]{1,2})?$' }
        deduction_bdt: { type: string, pattern: '^[0-9]+(\.[0-9]{1,2})?$' }
        note: { type: string, maxLength: 500 }
    ClassInput:
      type: object
      required: [name, display_order, is_active]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        display_order: { type: integer, minimum: 0, maximum: 100000 }
        is_active: { type: boolean }
    AcademicClass:
      allOf: [{ $ref: '#/components/schemas/ClassInput' }, { type: object, required: [id], properties: { id: { type: string, format: uuid } } }]
    ClassResponse: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/AcademicClass' } } }
    ClassPageResponse: { type: object, required: [data], properties: { data: { type: object, required: [items, total, page, page_size], properties: { items: { type: array, items: { $ref: '#/components/schemas/AcademicClass' } }, total: { type: integer }, page: { type: integer }, page_size: { type: integer } } } } }
    SubjectInput:
      type: object
      required: [name_en, name_bn, code, is_active]
      properties:
        name_en: { type: string, minLength: 1, maxLength: 160 }
        name_bn: { type: string, minLength: 1, maxLength: 160 }
        code: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,31}$' }
        is_active: { type: boolean }
    AcademicSubject:
      allOf: [{ $ref: '#/components/schemas/SubjectInput' }, { type: object, required: [id], properties: { id: { type: string, format: uuid } } }]
    SubjectResponse: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/AcademicSubject' } } }
    SubjectPageResponse: { type: object, required: [data], properties: { data: { type: object, required: [items, total, page, page_size], properties: { items: { type: array, items: { $ref: '#/components/schemas/AcademicSubject' } }, total: { type: integer }, page: { type: integer }, page_size: { type: integer } } } } }
    MappingFlags:
      type: object
      required: [is_required, is_fourth_subject]
      oneOf:
        - properties: { is_required: { enum: [true] }, is_fourth_subject: { enum: [false] } }
        - properties: { is_required: { enum: [false] }, is_fourth_subject: { enum: [true] } }
    MappingInput:
      allOf: [{ $ref: '#/components/schemas/MappingFlags' }, { type: object, required: [subject_id], properties: { subject_id: { type: string, format: uuid } } }]
    ClassSubject:
      type: object
      required: [id, class_id, subject_id, is_required, is_fourth_subject, subject_name_en, subject_name_bn, subject_code]
      properties:
        id: { type: string, format: uuid }
        class_id: { type: string, format: uuid }
        subject_id: { type: string, format: uuid }
        is_required: { type: boolean }
        is_fourth_subject: { type: boolean }
        subject_name_en: { type: string }
        subject_name_bn: { type: string }
        subject_code: { type: string }
    MappingResponse: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/ClassSubject' } } }
    MappingPageResponse: { type: object, required: [data], properties: { data: { type: object, required: [items, total, page, page_size], properties: { items: { type: array, items: { $ref: '#/components/schemas/ClassSubject' } }, total: { type: integer }, page: { type: integer }, page_size: { type: integer } } } } }
    AcademicSession:
      type: object
      required: [id, name, start_date, end_date, is_active, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: '2026–2027' }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AcademicSessionInput:
      type: object
      required: [name, start_date, end_date]
      additionalProperties: false
      properties:
        name: { type: string, pattern: '^[0-9]{4}([-–][0-9]{4})?$', description: A year or two consecutive years }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date, description: Must be after start_date }
    AcademicSessionActivationInput:
      type: object
      required: [is_active]
      additionalProperties: false
      properties:
        is_active: { type: boolean }
    AcademicSessionResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/AcademicSession' }
    AcademicSessionPageResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [items, total, page, page_size]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/AcademicSession' } }
            total: { type: integer }
            page: { type: integer }
            page_size: { type: integer }
    ManagedUser:
      type: object
      required: [id, email, display_name, role, is_active]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        role: { type: string, enum: [admin, head_teacher, teacher, student, guardian, accountant] }
        is_active: { type: boolean }
    ManagedUserResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ManagedUser' }
    UserPageResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [items, total, page, page_size]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/ManagedUser' } }
            total: { type: integer }
            page: { type: integer }
            page_size: { type: integer }
    CreateUserInput:
      type: object
      required: [email, display_name, role, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        display_name: { type: string, minLength: 1, maxLength: 160 }
        role: { type: string, enum: [admin, head_teacher, teacher, student, guardian, accountant] }
        password: { type: string, format: password, description: 12 to 72 UTF-8 bytes }
    UpdateUserInput:
      type: object
      required: [email, display_name]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        display_name: { type: string, minLength: 1, maxLength: 160 }
    StatusInput:
      type: object
      required: [is_active]
      additionalProperties: false
      properties:
        is_active: { type: boolean }
    AuditEvent:
      type: object
      required: [id, created_at, action, target_type, target_id, outcome, metadata]
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        actor_user_id: { type: string, format: uuid, nullable: true }
        action: { type: string }
        target_type: { type: string }
        target_id: { type: string }
        outcome: { type: string, enum: [success, denied] }
        metadata: { type: object, description: Explicit safe metadata only; no credentials or token material }
    AuditPageResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [items, total, page, page_size]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
            total: { type: integer }
            page: { type: integer }
            page_size: { type: integer }
    DashboardNavigation:
      type: object
      required: [key, name, path, coming_soon]
      properties:
        key: { type: string }
        name: { type: string }
        path: { type: string }
        coming_soon: { type: boolean }
    DashboardResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [user, branding, navigation]
          properties:
            user: { $ref: '#/components/schemas/AuthUser' }
            branding: { $ref: '#/components/schemas/Branding' }
            navigation: { type: array, items: { $ref: '#/components/schemas/DashboardNavigation' } }
            summary:
              type: object
              description: Present only for administrators with users:read.
              properties:
                total_users: { type: integer }
                active_users: { type: integer }
                inactive_users: { type: integer }
                by_role: { type: array, items: { type: object, properties: { role: { type: string }, count: { type: integer } } } }
                enabled_modules: { type: integer }
                school_fields_complete: { type: integer }
                school_fields_total: { type: integer }
    Branding:
      type: object
      required: [name_en, name_bn, logo_url, preferred_language, primary_color, secondary_color, dashboard_theme]
      properties:
        name_en: { type: string }
        name_bn: { type: string }
        logo_url: { type: string, description: Optional HTTPS PNG, JPEG, or WebP URL }
        preferred_language: { type: string, enum: [en, bn] }
        primary_color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        secondary_color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        dashboard_theme: { type: string, enum: [light, dark] }
    BrandingResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Branding' }
    SchoolSettingsInput:
      allOf: [{ $ref: '#/components/schemas/Branding' }]
      type: object
      required: [address, phone, email, grading_scheme_id]
      properties:
        address: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        grading_scheme_id: { type: string, example: bd_default }
    SchoolSettings:
      allOf: [{ $ref: '#/components/schemas/SchoolSettingsInput' }]
      type: object
      properties:
        updated_at: { type: string, format: date-time }
    SchoolSettingsResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/SchoolSettings' }
    GradeBand:
      type: object
      required: [grade, min_marks, max_marks, gpa]
      properties:
        grade: { type: string }
        min_marks: { type: integer, minimum: 0, maximum: 100 }
        max_marks: { type: integer, minimum: 0, maximum: 100 }
        gpa: { type: number, minimum: 0, maximum: 5, multipleOf: 0.01 }
    GradingInput:
      type: object
      required: [bands]
      additionalProperties: false
      properties:
        bands: { type: array, minItems: 1, maxItems: 30, items: { $ref: '#/components/schemas/GradeBand' } }
    GradingResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/GradeBand' } }
    SchoolModule:
      type: object
      required: [key, name, is_core, enabled]
      properties:
        key: { type: string }
        name: { type: string }
        is_core: { type: boolean }
        enabled: { type: boolean }
    ModuleResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/SchoolModule' }
    ModulePageResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [items, total, page, page_size]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/SchoolModule' } }
            total: { type: integer }
            page: { type: integer }
            page_size: { type: integer }
    IDListRequest:
      type: object
      required: [ids]
      additionalProperties: false
      properties:
        ids: { type: array, uniqueItems: true, items: { type: string } }
    SingleRoleRequest:
      allOf: [{ $ref: '#/components/schemas/IDListRequest' }]
      description: The ids array must contain exactly one role identifier.
    IDListResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { type: string } }
    RolePageResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [items, total, page, page_size]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Role' } }
            total: { type: integer }
            page: { type: integer }
            page_size: { type: integer }
    PermissionPageResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [items, total, page, page_size]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Permission' } }
            total: { type: integer }
            page: { type: integer }
            page_size: { type: integer }
    Role:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    Permission:
      type: object
      required: [id, description]
      properties:
        id: { type: string }
        description: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password, minLength: 1, maxLength: 72 }
    AuthUser:
      type: object
      required: [id, email, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        role:
          type: string
          enum: [admin, head_teacher, teacher, student, guardian, accountant]
    AuthResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [user, access_token]
          properties:
            user: { $ref: '#/components/schemas/AuthUser' }
            access_token: { type: string, description: JWT access token; expires in 15 minutes }
    UserResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/AuthUser' }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
    HealthResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [ok]
