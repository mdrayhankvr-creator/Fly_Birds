      summary: "Mock SMS log with masked numbers"
      description: "Requires notifications:manage and administrator role. status sent_mock means the mock provider accepted the message; no SMS is delivered to a phone."
      tags: [notifications]
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Paginated log with counts }, '403': { description: Permission, role or module denied }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      summary: "Mark one own notification read"
      description: "Requires notifications:read_self. Other users' notifications read as not found."
      tags: [notifications]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Read }, '404': { description: Not found }, '403': { description: Permission, role or module denied }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /diary/assignments:
    get:
      operationId: listDiaryAssignments
      summary: "Sections and subjects the teacher may write for, with that day's diary status"
      description: "Requires diary:write. Requires the diary module. Based on active teacher assignments in the active session."
      tags: [diary]
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Assignments }, '403': { description: Permission, role or module denied }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /diary/teaching:
    get:
      operationId: listOwnDiaries
      summary: "The teacher's own diaries"
      description: "Requires diary:write. Requires the diary module."
      tags: [diary]
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Paginated diaries }, '403': { description: Permission, role or module denied }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /diary:
    post:
      operationId: createDiary
      summary: "Create a draft diary"
      description: "Requires diary:write and teacher or head teacher role. The teacher must be assigned to the section's class and the subject in the session; the date must be inside the session and at most 7 days ahead. One diary per section, subject and day."
      tags: [diary]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DiaryInput' } } } }
      responses: { '201': { description: Draft }, '403': { description: Not assigned }, '409': { description: Already exists }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /diary/files:
    post:
      operationId: uploadDiaryFile
      summary: "Upload a PDF or image for a diary"
      description: "Requires diary:write and teacher or head teacher role. Same validation as notice files."
      tags: [diary]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } } } } }
      responses: { '201': { description: Upload id }, '413': { description: Too large }, '415': { description: Unsupported type }, '403': { description: Permission, role or module denied }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /diary/me:
    get:
      operationId: listOwnClassDiary
      summary: "Published diaries of the student's current section"
      description: "Requires diary:read_self and student role. Requires the diary module. Filters from, to, subject_id, search."
      tags: [diary]
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Paginated diaries }, '403': { description: Permission, role or module denied }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /diary/children/{studentId}:
    get:
      operationId: listChildClassDiary
      summary: "Published diaries of a linked child's section"
      description: "Requires diary:read_children and guardian role. Unlinked students read as not found."
      tags: [diary]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: studentId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Paginated diaries }, '404': { description: Not linked }, '403': { description: Permission, role or module denied }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /diary/all:
    get:
      operationId: listAllDiaries
      summary: "All diaries for oversight"
      description: "Requires diary:read. Requires the diary module."
      tags: [diary]
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Paginated diaries }, '403': { description: Permission, role or module denied }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /diary/compliance:
    get:
      operationId: getDiaryCompliance
      summary: "Diary status per assigned section and subject for a date"
      description: "Requires diary:read. Requires the diary module."
      tags: [diary]
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Rows }, '403': { description: Permission, role or module denied }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /diary/settings:
    get:
      operationId: getDiarySettings
      summary: "Daily publication settings"
      description: "Requires diary:manage. Requires the diary module."
      tags: [diary]
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Settings }, '403': { description: Permission, role or module denied }, '401': { $ref: '#/components/responses/Unauthorized' } }
    put:
      operationId: saveDiarySettings
      summary: "Require daily publication and set the teacher reminder time"
      description: "Requires diary:manage and administrator role. Reminders go to teachers with unpublished diaries after reminder_time (Bangladesh time), except Fridays."
      tags: [diary]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [daily_required, reminder_time], properties: { daily_required: { type: boolean }, reminder_time: { type: string, example: '16:00' } } } } } }
      responses: { '200': { description: Settings }, '403': { description: Permission, role or module denied }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /diary/homework/files:
    post:
      operationId: uploadHomeworkFile
      summary: "Upload a homework file"
      description: "Requires diary:read_self and student role. Same validation as other attachments."
      tags: [diary]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } } } } }
      responses: { '201': { description: Upload id }, '403': { description: Permission, role or module denied }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /diary/submissions/{id}/review:
    patch:
      operationId: reviewHomework
      summary: "Mark a submission reviewed with a note"
      description: "Requires diary:write and teacher or head teacher role; only the diary author. Reviewed submissions can no longer be changed by the student."
      tags: [diary]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { note: { type: string, maxLength: 2000 } } } } } }
      responses: { '200': { description: Submission }, '403': { description: Permission, role or module denied }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /diary/submissions/{id}/files/{fileId}:
    get:
      operationId: getHomeworkFile
      summary: "Download a homework file"
      description: "Requires Any diary permission; allowed for the student, linked guardians, the diary author and oversight."
      tags: [diary]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: fileId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: File }, '404': { description: Not visible }, '403': { description: Permission, role or module denied }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /diary/{id}:
    get:
      operationId: getDiary
      summary: "Read one diary"
      description: "Requires Any diary permission. Authors and oversight see any status; students and guardians only published diaries of the (linked) student's section (guardians may pass student_id)."
      tags: [diary]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Diary }, '404': { description: Not visible }, '403': { description: Permission, role or module denied }, '401': { $ref: '#/components/responses/Unauthorized' } }
    patch:
      operationId: updateDiary
      summary: "Edit own diary content, submission settings and files"
      description: "Requires diary:write and teacher or head teacher role; author only, while still assigned."
      tags: [diary]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DiaryInput' } } } }
      responses: { '200': { description: Diary }, '403': { description: No longer assigned }, '401': { $ref: '#/components/responses/Unauthorized' } }
    delete:
      operationId: deleteDiary
      summary: "Delete own draft diary"
      description: "Requires diary:write and teacher or head teacher role."
      tags: [diary]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Deleted }, '409': { description: Published }, '403': { description: Permission, role or module denied }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /diary/{id}/publish:
    post:
      operationId: publishDiary
      summary: "Publish own diary"
      description: "Requires diary:write and teacher or head teacher role. Needs some content."
      tags: [diary]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Diary }, '403': { description: Permission, role or module denied }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /diary/{id}/files/{fileId}:
    get:
      operationId: getDiaryFile
      summary: "Download a diary attachment"
      description: "Requires Any diary permission and visibility of the diary."
      tags: [diary]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: fileId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: File }, '404': { description: Not visible }, '403': { description: Permission, role or module denied }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /diary/{id}/submissions:
    get:
      operationId: listHomeworkSubmissions
      summary: "Section roster with each student's submission"
      description: "Requires diary:write (author) or diary:read."
      tags: [diary]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Submissions; status missing for non-submitters }, '403': { description: Permission, role or module denied }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /diary/{id}/submission:
    get:
      operationId: getOwnHomework
      summary: "The student's own submission"
      description: "Requires diary:read_self."
      tags: [diary]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Submission }, '404': { description: None }, '403': { description: Permission, role or module denied }, '401': { $ref: '#/components/responses/Unauthorized' } }
    put:
      operationId: submitHomework
      summary: "Submit or replace homework"
      description: "Requires diary:read_self and student role. Only when the diary is published, submission is enabled, any due time has not passed and the work is not yet reviewed. Text and/or up to 5 own homework uploads."
      tags: [diary]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { answer_text: { type: string, maxLength: 10000 }, file_ids: { type: array, maxItems: 5, items: { type: string, format: uuid } } } } } } }
      responses: { '200': { description: Submission }, '409': { description: submission_closed or already reviewed }, '403': { description: Permission, role or module denied }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /audit/actions:
    get:
      operationId: listAuditActions
      tags: [audit]
      summary: Recorded audit action names with counts for filtering
      description: Requires active admin, audit:read and the permissions module.
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Action counts }, '403': { $ref: '#/components/responses/Forbidden' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /permissions/matrix:
    get:
      operationId: getPermissionMatrix
      tags: [authorization]
      summary: Every role (with active user count), permission (with group) and grant, plus protected grants
      description: Requires active admin and permissions:read. Protected grants (admin auth:read_self and permissions:manage) cannot be removed.
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Permission matrix }, '403': { $ref: '#/components/responses/Forbidden' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /roles/{id}/permissions/history:
    get:
      operationId: getRolePermissionHistory
      tags: [authorization]
      summary: Saved permission changes for a role as additions and removals, newest first
      description: Requires active admin and permissions:read. Built from permissions.replace audit events.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/RoleId' }, { name: page, in: query, schema: { type: integer, minimum: 1 } }, { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }]
      responses: { '200': { description: Paginated history }, '403': { $ref: '#/components/responses/Forbidden' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Administrator control center summary
      description: Requires active admin and system:read. Users by role, locked accounts, active students, guardians and staff, modules, fees outstanding and overdue, exams, mock SMS queue, attachments, audit activity and denied attempts in the last day, last backup, schema version and database size.
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Overview }, '403': { $ref: '#/components/responses/Forbidden' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /admin/exports:
    get:
      operationId: listExportDatasets
      tags: [admin]
      summary: Exportable datasets with row counts
      description: Requires active admin and data:export. Ranged datasets (student_attendance, fee_payments, ledger, audit_log) report counts for from..to (up to 400 days) and -1 without a valid range.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: from, in: query, schema: { type: string, format: date } }, { name: to, in: query, schema: { type: string, format: date } }]
      responses: { '200': { description: Datasets }, '403': { $ref: '#/components/responses/Forbidden' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /admin/exports/{dataset}:
    get:
      operationId: exportDataset
      tags: [admin]
      summary: Download one dataset as CSV
      description: Requires active admin and data:export. UTF-8 with a byte order mark; cells starting with = + - @ tab or carriage return are prefixed with an apostrophe to prevent spreadsheet formula injection. Password hashes, sessions and file contents are never exported. Every export is audited (data.exported).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: dataset, in: path, required: true, schema: { type: string, enum: [users, students, guardians, staff, student_attendance, exam_results, fee_payments, ledger, audit_log] } }
        - { name: from, in: query, schema: { type: string, format: date }, description: Required for ranged datasets }
        - { name: to, in: query, schema: { type: string, format: date }, description: Required for ranged datasets }
      responses: { '200': { description: CSV file, content: { text/csv: { schema: { type: string } } } }, '400': { description: Missing or invalid range }, '404': { description: Unknown dataset }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /admin/backups:
    get:
      operationId: listBackups
      tags: [admin]
      summary: Backup runs, newest first, with the retention count
      description: Requires active admin and backups:manage.
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Paginated backup runs }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      operationId: createBackup
      tags: [admin]
      summary: Take a consistent backup now
      description: Requires active admin and backups:manage. Copies every table except auth_sessions in one read-only REPEATABLE READ snapshot plus sequence values and attachments into a .tar.gz with a SHA-256 manifest under BACKUP_DIR, then prunes archives beyond BACKUP_RETENTION. Archives contain personal data and password hashes and must be stored securely. Restore with the restore-backup command.
      security: [{ bearerAuth: [] }]
      responses: { '201': { description: Completed run }, '409': { description: backup_running }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /admin/backups/{id}:
    delete:
      operationId: deleteBackup
      tags: [admin]
      summary: Delete a backup archive
      description: Requires active admin and backups:manage. The run stays in the history as deleted.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Deleted }, '404': { description: Unknown or already deleted }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /admin/backups/{id}/verify:
    post:
      operationId: verifyBackup
      tags: [admin]
      summary: Re-check an archive's checksum and every manifest entry
      description: Requires active admin and backups:manage. Audited as backup.verified.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Verification result }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /admin/backups/{id}/download:
    get:
      operationId: downloadBackup
      tags: [admin]
      summary: Download a backup archive
      description: Requires active admin and backups:manage. Audited as backup.downloaded.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Archive, content: { application/gzip: { schema: { type: string, format: binary } } } }, '404': { description: Unavailable }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /analytics/options:
    get:
      operationId: getAnalyticsOptions
      tags: [analytics]
      summary: Filter choices for analytics
      description: Requires any of analytics:read, analytics:read_assigned or analytics:finance and the analytics module. Sessions, the selected session (default the active one), classes and sections (only assigned classes for analytics:read_assigned), published exams (academic viewers only), enabled modules, alert thresholds and today's date in Asia/Dhaka.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/AnalyticsSession' }]
      responses: { '200': { description: Options }, '400': { $ref: '#/components/responses/InvalidRequest' }, '403': { $ref: '#/components/responses/Forbidden' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /analytics/overview:
    get:
      operationId: getAnalyticsOverview
      tags: [analytics]
      summary: School-wide analytics headline
      description: Requires analytics:read and the analytics module. Students by status and class, active teachers, non-teaching staff and guardians; today's student and teacher attendance and the last 30 days (attendance module); result summary (examinations module); at-risk and dropout counts; fee summary only when the viewer also holds analytics:finance and fees is enabled. Sections for disabled modules are null.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/AnalyticsSession' }]
      responses: { '200': { description: Overview }, '400': { $ref: '#/components/responses/InvalidRequest' }, '403': { $ref: '#/components/responses/Forbidden' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /analytics/attendance:
    get:
      operationId: getAttendanceAnalytics
      tags: [analytics]
      summary: Student attendance trend and breakdown
      description: Requires analytics:read (all classes) or analytics:read_assigned (only classes assigned to the teacher in the session; another class is 403), plus the analytics and attendance modules. Defaults to the last 30 days; ranges are at most 400 days and may not end after today. Rate is (present + late) / marked, null when nothing was marked. Groups by class, or by section when class_id or section_id is given. School-scope viewers also receive school-wide teacher attendance, where rate is present / (present + absent) and leave is excluded.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/AnalyticsSession' }, { $ref: '#/components/parameters/AnalyticsClass' }, { $ref: '#/components/parameters/AnalyticsSection' }, { $ref: '#/components/parameters/AnalyticsFrom' }, { $ref: '#/components/parameters/AnalyticsTo' }, { $ref: '#/components/parameters/AnalyticsGroup' }]
      responses: { '200': { description: Attendance analytics }, '400': { $ref: '#/components/responses/InvalidRequest' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /analytics/exams:
    get:
      operationId: getExamAnalytics
      tags: [analytics]
      summary: Pass rates, GPA distribution and subject performance
      description: Requires analytics:read or analytics:read_assigned (assigned classes; subject figures only for assigned subjects), plus the analytics and examinations modules. Uses published and locked exams only. Pass rate is passed / results. The GPA distribution maps each overall GPA to the school's configured grading bands; failed results count in the lowest band. At most 60 exams are listed, newest first.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/AnalyticsSession' }, { $ref: '#/components/parameters/AnalyticsClass' }, { $ref: '#/components/parameters/AnalyticsSection' }, { $ref: '#/components/parameters/AnalyticsExam' }, { $ref: '#/components/parameters/AnalyticsExamType' }]
      responses: { '200': { description: Examination analytics }, '400': { $ref: '#/components/responses/InvalidRequest' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /analytics/fees:
    get:
      operationId: getFeeAnalytics
      tags: [analytics]
      summary: Fee collection, dues, income and expenses
      description: Requires analytics:finance plus the analytics and fees modules. Defaults to the first day of the month eleven months ago through today (at most 400 days). Billed figures use dues falling due in the range; collected uses payments received in the range against the session's dues; outstanding, overdue, aging buckets and the ten largest overdue balances are as of today. Ledger income and expense are school-wide and ignore class_id.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/AnalyticsSession' }, { $ref: '#/components/parameters/AnalyticsClass' }, { $ref: '#/components/parameters/AnalyticsFrom' }, { $ref: '#/components/parameters/AnalyticsTo' }]
      responses: { '200': { description: Fee analytics }, '400': { $ref: '#/components/responses/InvalidRequest' }, '403': { $ref: '#/components/responses/Forbidden' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /analytics/sessions:
    get:
      operationId: compareAnalyticsSessions
      tags: [analytics]
      summary: Compare the eight most recent academic sessions
      description: Requires analytics:read and the analytics module. Active students, attendance rate, published exams, pass rate and average GPA per session; net billed, collected and collection rate only for viewers who also hold analytics:finance.
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Session comparison }, '403': { $ref: '#/components/responses/Forbidden' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /analytics/risks:
    get:
      operationId: listStudentAlerts
      tags: [analytics]
      summary: At-risk and dropout alerts
      description: Requires analytics:read or analytics:read_assigned (assigned classes only) and the analytics module. Rule-based, not predicted. Dropout - the latest absences form an unbroken run of at least consecutive_absences, or no presence within inactivity_days while the section was marked on at least min_marked_days days (students admitted inside that window are skipped). At risk - attendance below attendance_threshold percent over attendance_window_days with at least min_marked_days marked, a failed latest exam, or a latest GPA below gpa_threshold. Attendance rules need the attendance module and exam rules the examinations module. Dropout alerts come first, then the lowest attendance.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/AnalyticsSession' }, { $ref: '#/components/parameters/AnalyticsClass' }, { $ref: '#/components/parameters/AnalyticsSection' }, { name: level, in: query, schema: { type: string, enum: [at_risk, dropout] } }, { name: reason, in: query, schema: { type: string, enum: [low_attendance, low_gpa, failed_exam, consecutive_absences, no_recent_presence] } }, { $ref: '#/components/parameters/Page' }, { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }]
      responses: { '200': { description: Alerts page with summary and thresholds }, '400': { $ref: '#/components/responses/InvalidRequest' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /analytics/settings:
    get:
      operationId: getAnalyticsSettings
      tags: [analytics]
      summary: Alert thresholds
      description: Requires analytics:read or analytics:read_assigned and the analytics module.
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Thresholds }, '403': { $ref: '#/components/responses/Forbidden' }, '401': { $ref: '#/components/responses/Unauthorized' } }
    put:
      operationId: saveAnalyticsSettings
      tags: [analytics]
      summary: Change alert thresholds
      description: Requires an active administrator with analytics:manage and the analytics module. attendance_threshold 1-100, attendance_window_days 7-120, min_marked_days 1-60 and not above the window, gpa_threshold 0-5, consecutive_absences 2-60, inactivity_days 7-120. Audited as analytics.settings_updated.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [attendance_threshold, attendance_window_days, min_marked_days, gpa_threshold, consecutive_absences, inactivity_days]
              properties:
                attendance_threshold: { type: number, minimum: 1, maximum: 100 }
                attendance_window_days: { type: integer, minimum: 7, maximum: 120 }
                min_marked_days: { type: integer, minimum: 1, maximum: 60 }
                gpa_threshold: { type: number, minimum: 0, maximum: 5 }
                consecutive_absences: { type: integer, minimum: 2, maximum: 60 }
                inactivity_days: { type: integer, minimum: 7, maximum: 120 }
      responses: { '200': { description: Saved thresholds }, '400': { $ref: '#/components/responses/InvalidRequest' }, '403': { $ref: '#/components/responses/Forbidden' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /analytics/students/{id}:
    get:
      operationId: getStudentAnalytics
      tags: [analytics]
      summary: One student's academic summary for staff
      description: Requires analytics:read (any student) or analytics:read_assigned (only students whose current class is assigned to the teacher; others are 404) and the analytics module. Session and last-30-day attendance, monthly trend and the last 14 marks; published results with grades and the latest exam's subjects; the student's alert; fee balance only for analytics:finance viewers.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Student summary }, '400': { $ref: '#/components/responses/InvalidRequest' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /analytics/me:
    get:
      operationId: getMyAnalytics
      tags: [analytics]
      summary: Own academic summary
      description: Requires the student role, analytics:read_self and the analytics module. Reads only the student record linked to the signed-in account. Fee balance is included when the student also holds fees:read_self and fees is enabled.
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Student summary }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /analytics/children:
    get:
      operationId: listChildrenAnalytics
      tags: [analytics]
      summary: Linked children's academic summaries
      description: Requires the guardian role, analytics:read_children and the analytics module. Only children linked to the signed-in guardian (at most 20). Fee balances need fees:read_children.
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Child summaries }, '403': { $ref: '#/components/responses/Forbidden' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /analytics/children/{studentId}:
    get:
      operationId: getChildAnalytics
      tags: [analytics]
      summary: One linked child's academic summary
      description: Requires the guardian role, analytics:read_children and the analytics module. A student not linked to the guardian is 404.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: studentId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Student summary }, '400': { $ref: '#/components/responses/InvalidRequest' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /analytics/reports:
    get:
      operationId: listAnalyticsReports
      tags: [analytics]
      summary: Available reports
      description: Requires any of analytics:read, analytics:read_assigned or analytics:finance and the analytics module. Each report names its access rule (academic, school or finance), source module, whether it takes a date range, and its columns.
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Report definitions }, '403': { $ref: '#/components/responses/Forbidden' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /analytics/reports/{report}:
    get:
      operationId: getAnalyticsReport
      tags: [analytics]
      summary: One page of a report
      description: Requires the analytics module, the report's source module and its access rule - student_attendance, exam_results and risks need analytics:read or analytics:read_assigned (assigned classes only); teacher_attendance needs analytics:read; fee_balances needs analytics:finance. Ranged reports default to the last 30 days. Rows are strings in the order of columns.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/AnalyticsReport' }, { $ref: '#/components/parameters/AnalyticsSession' }, { $ref: '#/components/parameters/AnalyticsClass' }, { $ref: '#/components/parameters/AnalyticsSection' }, { $ref: '#/components/parameters/AnalyticsExam' }, { $ref: '#/components/parameters/AnalyticsFrom' }, { $ref: '#/components/parameters/AnalyticsTo' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses: { '200': { description: Report page }, '400': { $ref: '#/components/responses/InvalidRequest' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /analytics/reports/{report}/csv:
    get:
      operationId: exportAnalyticsReport
      tags: [analytics]
      summary: Download a whole report as CSV
      description: Same access as the report page. Up to 20000 rows, UTF-8 with a byte order mark; cells starting with = + - @ tab or carriage return are prefixed with an apostrophe. X-Total-Rows gives the full row count. Audited as analytics.exported with the report and filters.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/AnalyticsReport' }, { $ref: '#/components/parameters/AnalyticsSession' }, { $ref: '#/components/parameters/AnalyticsClass' }, { $ref: '#/components/parameters/AnalyticsSection' }, { $ref: '#/components/parameters/AnalyticsExam' }, { $ref: '#/components/parameters/AnalyticsFrom' }, { $ref: '#/components/parameters/AnalyticsTo' }]
      responses: { '200': { description: CSV file, content: { text/csv: { schema: { type: string } } } }, '400': { $ref: '#/components/responses/InvalidRequest' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '401': { $ref: '#/components/responses/Unauthorized' } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Search: { name: search, in: query, schema: { type: string, maxLength: 100 }, description: Case-insensitive ID or label search }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
    RoleId: { name: id, in: path, required: true, schema: { type: string }, description: One of the six role identifiers }
    UserId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    AcademicId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    AcademicStatus: { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
    FeeId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    FeeSession: { name: session_id, in: query, schema: { type: string, format: uuid } }
    FeeClass: { name: class_id, in: query, schema: { type: string, format: uuid } }
    FeeFrom: { name: from, in: query, schema: { type: string, format: date } }
    FeeTo: { name: to, in: query, schema: { type: string, format: date } }
    FeeMethod: { name: method, in: query, schema: { type: string, enum: [cash, bank, bkash, nagad] } }
    AnalyticsSession: { name: session_id, in: query, schema: { type: string, format: uuid }, description: Defaults to the active session, else the most recent }
    AnalyticsClass: { name: class_id, in: query, schema: { type: string, format: uuid } }
    AnalyticsSection: { name: section_id, in: query, schema: { type: string, format: uuid }, description: Must belong to the session (and to class_id when both are given) }
    AnalyticsExam: { name: exam_id, in: query, schema: { type: string, format: uuid } }
    AnalyticsExamType: { name: exam_type, in: query, schema: { type: string, enum: [class_test, half_yearly, annual, other] } }
    AnalyticsFrom: { name: from, in: query, schema: { type: string, format: date } }
    AnalyticsTo: { name: to, in: query, schema: { type: string, format: date }, description: Defaults to today (Asia/Dhaka); may not be in the future }
    AnalyticsGroup: { name: group, in: query, schema: { type: string, enum: [day, week, month] }, description: Default daily up to 62 days, weekly up to 190, else monthly; daily allows at most 93 days }
    AnalyticsReport: { name: report, in: path, required: true, schema: { type: string, enum: [student_attendance, teacher_attendance, exam_results, fee_balances, risks] } }
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
  responses:
    AcademicConflict: { description: Duplicate class, subject code, assignment, or inactive assignment target }
    IDList:
      description: Current identifiers
      content:
        application/json:
          schema: { $ref: '#/components/schemas/IDListResponse' }
    NotFound:
      description: Requested resource does not exist
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    LastAdmin:
      description: Change would remove the last authorized administrator
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InvalidRequest:
      description: Invalid JSON or request data
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InvalidCredentials:
      description: Generic incorrect credentials response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InvalidSession:
      description: Session is missing, expired, or revoked
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Access token is missing or invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Permission denied
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UnsupportedMediaType:
      description: Login requires application/json
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    AuthUnavailable:
      description: Authentication requires a configured database
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    NoticeInput:
      type: object
      required: [title_en, audience_roles]
      properties:
        title_en: { type: string, maxLength: 200 }
        title_bn: { type: string }
        body_en: { type: string }
        body_bn: { type: string, description: At least one body is required }
        priority: { type: string, enum: [normal, important, urgent] }
        audience_roles: { type: array, minItems: 1, items: { type: string, enum: [head_teacher, teacher, student, guardian, accountant] } }
        targets: { type: array, maxItems: 50, items: { type: object, required: [class_id], properties: { class_id: { type: string, format: uuid }, section_id: { type: string, format: uuid, nullable: true } } } }
        expires_at: { type: string, format: date-time, nullable: true }
        file_ids: { type: array, maxItems: 10, items: { type: string, format: uuid } }
    EventInput:
      type: object
      required: [title_en, kind, starts_on, ends_on, audience_roles]
      properties:
        title_en: { type: string, maxLength: 200 }
        title_bn: { type: string }
        description_en: { type: string }
        description_bn: { type: string }
        kind: { type: string, enum: [holiday, exam, meeting, event, other] }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date }
        start_time: { type: string, example: '09:00', nullable: true }
        end_time: { type: string, example: '11:00', nullable: true }
        location: { type: string }
        audience_roles: { type: array, items: { type: string } }
        targets: { type: array, items: { type: object, properties: { class_id: { type: string, format: uuid }, section_id: { type: string, format: uuid, nullable: true } } } }
    DiaryInput:
      type: object
      properties:
        section_id: { type: string, format: uuid, description: Required on create }
        subject_id: { type: string, format: uuid, description: Required on create }
        diary_date: { type: string, format: date, description: Required on create }
        lesson_topics: { type: string }
        class_notes: { type: string }
        homework: { type: string }
        instructions: { type: string }
        submission_enabled: { type: boolean, default: false }
        submission_due_at: { type: string, format: date-time, nullable: true, description: Only with submission_enabled }
        file_ids: { type: array, maxItems: 10, items: { type: string, format: uuid } }
    FeeCategoryInput:
      type: object
      required: [code, name_en, frequency]
      properties:
        code: { type: string, pattern: '^[A-Z0-9_-]{2,20}$' }
        name_en: { type: string, maxLength: 120 }
        name_bn: { type: string }
        frequency: { type: string, enum: [monthly, one_time] }
        is_active: { type: boolean, default: true }
    FeeStructureInput:
      type: object
      required: [session_id, class_id, category_id, amount]
      properties:
        session_id: { type: string, format: uuid }
        class_id: { type: string, format: uuid }
        category_id: { type: string, format: uuid }
        amount: { type: number, minimum: 0.01, maximum: 10000000, description: Taka with at most two decimals }
        due_day: { type: integer, minimum: 1, maximum: 28, default: 10 }
        is_active: { type: boolean, default: true }
    FeeConcessionInput:
      type: object
      required: [student_id, category_id, percent, reason]
      properties:
        student_id: { type: string, format: uuid }
        category_id: { type: string, format: uuid }
        percent: { type: number, minimum: 0.01, maximum: 100 }
        reason: { type: string, maxLength: 240 }
    FeeDueInput:
      type: object
      required: [student_id, structure_id]
      properties:
        student_id: { type: string, format: uuid }
        structure_id: { type: string, format: uuid }
        period: { type: string, pattern: '^\d{4}-\d{2}$', description: Required for monthly fees; sets the due month for one-time fees }
    FeeGenerateInput:
      type: object
      required: [session_id, period]
      properties:
        session_id: { type: string, format: uuid }
        class_id: { type: string, format: uuid, description: Omit for every class in the session }
        period: { type: string, pattern: '^\d{4}-\d{2}$' }
        include_one_time: { type: boolean, default: false }
    FeeAdjustmentInput:
      type: object
      required: [kind, reason]
      properties:
        kind: { type: string, enum: [discount, waiver] }
        amount: { type: number, description: Required for discounts; ignored for waivers }
        reason: { type: string, maxLength: 240 }
    FeePaymentInput:
      type: object
      required: [student_id, amount, method, idempotency_key]
      properties:
        student_id: { type: string, format: uuid }
        amount: { type: number, minimum: 0.01 }
        method: { type: string, enum: [cash, bank, bkash, nagad] }
        reference: { type: string, maxLength: 80, description: Required except for cash }
        paid_on: { type: string, format: date, description: Defaults to today in Bangladesh time; cannot be in the future }
        note: { type: string, maxLength: 240 }
        idempotency_key: { type: string, format: uuid, description: One key per payment attempt }
        fee_ids: { type: array, maxItems: 200, items: { type: string, format: uuid }, description: Optional dues to settle; defaults to all outstanding dues, oldest first }
    FeeIntentInput:
      type: object
      required: [provider, amount]
      properties:
        student_id: { type: string, format: uuid, description: Required for guardians }
        provider: { type: string, enum: [bkash, nagad] }
        amount: { type: number, minimum: 0.01 }
    LedgerEntryInput:
      type: object
      required: [entry_type, category, amount, entry_date, description]
      properties:
        entry_type: { type: string, enum: [income, expense] }
        category: { type: string, enum: [donation, grant, other_income, salary, utilities, supplies, maintenance, transport, events, other_expense] }
        amount: { type: number, minimum: 0.01 }
        entry_date: { type: string, format: date }
        description: { type: string, maxLength: 240 }
        reference: { type: string, maxLength: 80 }
    FeeDue:
      type: object
      properties:
        id: { type: string, format: uuid }
        student_id: { type: string, format: uuid }
        period: { type: string, nullable: true }
        due_date: { type: string, format: date }
        amount: { type: number }
        discount_amount: { type: number }
        paid_amount: { type: number }
        balance: { type: number }
        status: { type: string, enum: [unpaid, partial, paid, waived] }
        overdue: { type: boolean }
        category_code: { type: string }
        category_name_en: { type: string }
        category_name_bn: { type: string }
    FeeReceipt:
      type: object
      properties:
        data:
          type: object
          properties:
            payment: { type: object, description: Receipt number, student, amount, method, reference, date and collector }
            allocations: { type: array, items: { type: object, properties: { student_fee_id: { type: string }, amount: { type: number }, category_name_en: { type: string }, period: { type: string, nullable: true } } } }
            balance_after: { type: number, description: Student's current outstanding balance }
            replayed: { type: boolean }
    FeeStatement:
      type: object
      properties:
        data:
          type: object
          properties:
            student: { type: object }
            dues: { type: array, items: { $ref: '#/components/schemas/FeeDue' } }
            payments: { type: array, items: { type: object } }
            totals: { type: object, properties: { charged: { type: number }, discount: { type: number }, paid: { type: number }, balance: { type: number }, overdue: { type: number } } }
    ExamInput:
      type: object
      required: [name, exam_type, session_id, class_id, section_id]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        exam_type: { type: string, enum: [class_test, half_yearly, annual, other] }
        session_id: { type: string, format: uuid }
        class_id: { type: string, format: uuid }
        section_id: { type: string, format: uuid }
        routine_id: { type: string, format: uuid, nullable: true }
    ExamSubjectInput:
      type: object
      required: [subject_id, full_marks, pass_marks]
      properties:
        subject_id: { type: string, format: uuid }
        full_marks: { type: number, minimum: 0.01, maximum: 1000, multipleOf: 0.01 }
        pass_marks: { type: number, minimum: 0, multipleOf: 0.01 }
    ExamMarksInput:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [exam_subject_id, student_id, marks]
            properties:
              exam_subject_id: { type: string, format: uuid }
              student_id: { type: string, format: uuid }
              marks: { type: number, minimum: 0, multipleOf: 0.01 }
    ClassRoutineInput:
      type: object
      required: [session_id, class_id, section_id, subject_id, teacher_id, day_of_week, start_time, end_time, room]
      properties:
        session_id: { type: string, format: uuid }
        class_id: { type: string, format: uuid }
        section_id: { type: string, format: uuid }
        subject_id: { type: string, format: uuid }
        teacher_id: { type: string, format: uuid }
