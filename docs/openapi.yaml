      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StudentAttendanceScan' } } } }
      responses: { '201': { description: Student marked present }, '403': { description: Unassigned actor } }
